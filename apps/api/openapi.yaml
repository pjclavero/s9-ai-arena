openapi: 3.1.0
info:
  title: S9 AI Arena · API de plataforma
  # 0.2.0 · H6 (issue #10): añade getBotRatingHistory y getTeamStandings.
  # 0.3.0 · R8 admin ops: añade getSystemStatus y getRbacMatrix (solo lectura, admin).
  # 0.4.0 · R11 espectador público (slice mínimo): añade listPublicLiveBattles
  # (gateado por S9_PUBLIC_SPECTATE_ENABLED, apagado por defecto).
  # 0.5.0 · R12 cuadro de torneo (slice 1, solo lectura): añade
  # listTournamentMatches (público, sin seeds/commitments).
  # 0.6.0 · N4/R10 slice 2 (persistencia backend del editor de mapas): añade
  # saveMapDraft (POST /maps/drafts) — guarda progreso (WIP) del editor sin
  # gatear con isPublishable, junto con el feedback del validador de E4.
  # 0.7.0 · N5/R11 estado público por batalla: añade getPublicLiveBattle
  # (GET /public/battles/{battleId}), gateado por S9_PUBLIC_SPECTATE_ENABLED.
  # A diferencia del listado, un recurso por-id con la capability apagada
  # responde 404 (no 200 enabled:false): revelar la existencia/estado de un
  # id concreto filtraría más que un listado vacío. Con la capability
  # encendida, 404 también si la batalla no existe o no está `running`
  # (nunca se revela su estado no-running a un visitante anónimo).
  # 0.8.0 · R11 acceso público a replay y batalla finalizada: añade
  # listPublicReplays (GET /public/replays), getPublicReplay
  # (GET /public/replays/{battleId}) y downloadPublicReplay
  # (GET /public/replays/{battleId}/download), gateadas por
  # S9_PUBLIC_REPLAYS_ENABLED (apagada por defecto). Solo batallas `finished`;
  # nunca seed/seedCommitment/seedRevealProof ni datos de propietario. Namespace
  # propio (no reutiliza /public/battles/{battleId}, que ya está ocupado por
  # getPublicLiveBattle para batallas `running` bajo S9_PUBLIC_SPECTATE_ENABLED).
  # 0.9.0 · PRC (TD-004) autorización de replays: añade listReplays
  # (GET /replays), getReplayIndex (GET /replays/{battleId}/index) y
  # getReplaySegment (GET /replays/{battleId}/segment), que sustituyen a las
  # lecturas anónimas del replay-service por el gateway. getReplay, verifyReplay
  # y las nuevas aplican la política de acceso (staff, dueño o equipo de un bot
  # participante, o replay público por S9_PUBLIC_REPLAYS_ENABLED); el resto
  # recibe 404, igual que un id inexistente.
  # Añadir un endpoint = MINOR (docs/compatibilidad.md, §2 Semver por paquete).
  version: 0.9.0
  description: |
    Contrato de la API de plataforma (capítulos 16, 17 y 23 del Dosier técnico).

    **Autorización.** Cada operación declara `x-min-role` con el rol mínimo requerido.
    La jerarquía es acumulativa: visitor < user < developer < team_captain < organizer < moderator < admin.
    El middleware de E7 lee esta extensión: la interfaz web solo oculta, nunca autoriza.
    Además del rol, toda operación sobre un recurso propio exige **autorización de objeto**
    (ser dueño o miembro del equipo dueño); un rol suficiente no da acceso a recursos ajenos.

    **Privacidad.** Los campos marcados con `x-private: true` no aparecen NUNCA en respuestas
    a `visitor`. El test de fuga por contrato de E7/T7.5 recorre esta extensión.

    **Paginación** por cursor opaco (`cursor` + `limit`), nunca por offset.

servers:
  - url: https://arena.example/api/v1

tags:
  - name: auth
  - name: users
  - name: teams
  - name: bots
  - name: builds
  - name: maps
  - name: catalog
  - name: tournaments
  - name: battles
  - name: replays
  - name: standings
  - name: admin
  - name: system

security:
  - bearerAuth: []

paths:
  # ------------------------------------------------------------------ AUTH
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Crear cuenta
      security: []
      x-min-role: visitor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { description: Cuenta creada, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Iniciar sesión (devuelve access + refresh; exige TOTP si hay 2FA activo)
      security: []
      x-min-role: visitor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Sesión iniciada, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      security: []
      x-min-role: visitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties: { refreshToken: { type: string } }
      responses:
        '200': { description: Nuevo par de tokens, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/sessions:
    get:
      tags: [auth]
      operationId: listSessions
      summary: Sesiones activas propias
      x-min-role: user
      responses:
        '200':
          description: Lista de sesiones
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Session' } }
  /auth/sessions/{sessionId}:
    delete:
      tags: [auth]
      operationId: revokeSession
      summary: Revocar una sesión (propia, o cualquiera si es admin)
      x-min-role: user
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '204': { description: Revocada }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/2fa:
    post:
      tags: [auth]
      operationId: enable2fa
      summary: Activar 2FA TOTP
      x-min-role: user
      responses:
        '200':
          description: Secreto TOTP y códigos de recuperación (se muestran una sola vez)
          content:
            application/json:
              schema:
                type: object
                properties:
                  otpauthUrl: { type: string, x-private: true }
                  recoveryCodes: { type: array, items: { type: string }, x-private: true }
    delete:
      tags: [auth]
      operationId: disable2fa
      summary: Desactivar 2FA (exige reautenticación fuerte — contraseña + TOTP o código de recuperación — y revoca el resto de sesiones)
      x-min-role: user
      # R2.4 (ERR-SEC-07): el token NO basta; sin credenciales frescas ⇒ 401 a propósito.
      x-reauth: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, totp]
              properties:
                password: { type: string, x-private: true }
                totp: { type: string, description: Código TOTP vigente o código de recuperación, x-private: true }
      responses:
        '204': { description: Desactivado (el resto de sesiones quedan revocadas) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ----------------------------------------------------------------- USERS
  /users/me:
    get:
      tags: [users]
      operationId: getMe
      x-min-role: user
      responses:
        '200': { description: Usuario propio, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
    patch:
      tags: [users]
      operationId: updateMe
      x-min-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, maxLength: 48 }
      responses:
        '200': { description: Actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }

  /users/{userId}:
    get:
      tags: [users]
      operationId: getUserPublic
      summary: Perfil público (nunca incluye email ni roles internos)
      x-min-role: visitor
      security: []
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200': { description: Perfil público, content: { application/json: { schema: { $ref: '#/components/schemas/PublicProfile' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{userId}/roles:
    put:
      tags: [admin]
      operationId: setUserRoles
      summary: Asignar roles (queda en audit_log)
      x-min-role: admin
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
      responses:
        '200': { description: Roles actualizados, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ----------------------------------------------------------------- TEAMS
  /teams:
    get:
      tags: [teams]
      operationId: listTeams
      x-min-role: visitor
      security: []
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { description: Equipos, content: { application/json: { schema: { $ref: '#/components/schemas/TeamPage' } } } }
    post:
      tags: [teams]
      operationId: createTeam
      summary: Crear equipo (el creador queda como capitán)
      x-min-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string, maxLength: 48 } }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/Team' } } } }

  /teams/{teamId}:
    get:
      tags: [teams]
      operationId: getTeam
      summary: 'FC-C · Un equipo. Anónimo/ajeno: solo nombre y recuentos (sin UUID de usuarios); miembro o staff: miembros y bots.'
      x-min-role: visitor
      security: []
      parameters: [{ $ref: '#/components/parameters/TeamId' }]
      responses:
        '200': { description: Equipo, content: { application/json: { schema: { $ref: '#/components/schemas/Team' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [teams]
      operationId: updateTeam
      summary: 'FC-C · Renombrar el equipo (solo su capitán o admin).'
      x-min-role: team_captain
      parameters: [{ $ref: '#/components/parameters/TeamId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string, maxLength: 48 } }
      responses:
        '200': { description: Actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Team' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Nombre en uso, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [teams]
      operationId: deleteTeam
      summary: 'FC-C · Borrar el equipo (solo su capitán o admin). Sus bots NO se borran: quedan sin equipo.'
      x-min-role: team_captain
      parameters: [{ $ref: '#/components/parameters/TeamId' }]
      responses:
        '204': { description: Borrado }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Referenciado por una competición, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /teams/{teamId}/bots:
    post:
      tags: [teams]
      operationId: addTeamBot
      summary: 'FC-C · Asignar un bot al equipo. Solo su dueño (que debe ser miembro) o admin; un bot ajeno es 404.'
      x-min-role: user
      parameters: [{ $ref: '#/components/parameters/TeamId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [botId]
              properties: { botId: { type: string } }
      responses:
        '201': { description: Bot asignado, content: { application/json: { schema: { $ref: '#/components/schemas/Team' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{teamId}/bots/{botId}:
    delete:
      tags: [teams]
      operationId: removeTeamBot
      summary: 'FC-C · Quitar un bot del equipo (su dueño, el capitán o admin). El bot no se borra.'
      x-min-role: user
      parameters: [{ $ref: '#/components/parameters/TeamId' }, { $ref: '#/components/parameters/BotId' }]
      responses:
        '204': { description: Quitado }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teams/{teamId}/members:
    post:
      tags: [teams]
      operationId: addTeamMember
      x-min-role: team_captain
      parameters: [{ $ref: '#/components/parameters/TeamId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'FC-C · basta con email O userId (el email evita teclear UUID).'
              properties:
                userId: { type: string }
                email: { type: string, format: email }
      responses:
        '201': { description: Miembro añadido, content: { application/json: { schema: { $ref: '#/components/schemas/Team' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /teams/{teamId}/members/{userId}:
    delete:
      tags: [teams]
      operationId: removeTeamMember
      x-min-role: team_captain
      parameters: [{ $ref: '#/components/parameters/TeamId' }, { $ref: '#/components/parameters/UserId' }]
      responses:
        '204': { description: Eliminado }

  # ------------------------------------------------------------------ BOTS
  /bots:
    get:
      tags: [bots]
      operationId: listBots
      summary: Lista bots visibles para el solicitante (públicos, o propios/de su equipo)
      x-min-role: visitor
      security: []
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - name: ownerId
          in: query
          schema: { type: string }
      responses:
        '200': { description: Bots, content: { application/json: { schema: { $ref: '#/components/schemas/BotPage' } } } }
    post:
      tags: [bots]
      operationId: createBot
      x-min-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 48 }
                visibility: { $ref: '#/components/schemas/Visibility' }
                teamId: { type: string }
      responses:
        '201': { description: Bot creado en estado draft, content: { application/json: { schema: { $ref: '#/components/schemas/Bot' } } } }

  /bots/{botId}:
    get:
      tags: [bots]
      operationId: getBot
      x-min-role: visitor
      security: []
      parameters: [{ $ref: '#/components/parameters/BotId' }]
      responses:
        '200': { description: Bot, content: { application/json: { schema: { $ref: '#/components/schemas/Bot' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [bots]
      operationId: updateBot
      summary: Editar metadatos del bot (solo el dueño; no afecta a versiones publicadas)
      x-min-role: user
      parameters: [{ $ref: '#/components/parameters/BotId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 48 }
                visibility: { $ref: '#/components/schemas/Visibility' }
      responses:
        '200': { description: Actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Bot' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /bots/{botId}/loadouts:
    post:
      tags: [bots]
      operationId: createLoadoutRevision
      summary: |
        Crear una revisión de loadout. El servidor ejecuta SIEMPRE el validador de ensamblaje
        de E3 (T3.2); un loadout ilegal devuelve 422 con la lista de violaciones. Un cambio de
        módulo crea revisión nueva aunque el código no cambie (cap. 17.2).
      x-min-role: user
      parameters: [{ $ref: '#/components/parameters/BotId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoadoutInput' }
      responses:
        '201': { description: Revisión creada, content: { application/json: { schema: { $ref: '#/components/schemas/Loadout' } } } }
        '422': { $ref: '#/components/responses/LoadoutInvalid' }

  /bots/{botId}/versions:
    get:
      tags: [bots]
      operationId: listBotVersions
      x-min-role: visitor
      security: []
      parameters: [{ $ref: '#/components/parameters/BotId' }]
      responses:
        '200':
          description: Versiones
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/BotVersion' } }
    post:
      tags: [bots]
      operationId: createBotVersion
      summary: Subir una versión de código (queda en draft; no compila todavía)
      x-min-role: developer
      parameters: [{ $ref: '#/components/parameters/BotId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [source, runtime, loadoutRevision]
              properties:
                source: { type: string, format: binary, description: 'Archivo comprimido del código. Límite 10 MB (E6.M).' }
                runtime: { $ref: '#/components/schemas/Runtime' }
                loadoutRevision: { type: integer }
                parentVersion: { type: integer, description: 'DEV-A · A9.13: versión de la que parte (nueva versión desde X); queda registrada' }
      responses:
        '201': { description: Versión creada, content: { application/json: { schema: { $ref: '#/components/schemas/BotVersion' } } } }
        '413': { description: Código demasiado grande, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /bots/{botId}/versions/{version}/source:
    get:
      tags: [bots]
      operationId: getBotSource
      summary: |
        Descargar el código. Solo el dueño, su equipo y moderadores/admin, salvo que la versión
        esté publicada con codePublic=true (D9). Un visitante NUNCA descarga código privado.
      x-min-role: user
      parameters: [{ $ref: '#/components/parameters/BotId' }, { $ref: '#/components/parameters/Version' }]
      responses:
        '200': { description: Código, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  # -------- DEV-A · A9: versionado real (historial, detalle, código, artefacto, diff, clonado)
  /bots/{botId}/versions/{version}:
    get:
      tags: [bots]
      operationId: getBotVersion
      summary: |
        Detalle de UNA versión: estado, build que la validó, último build, artefacto y versión padre.
        Misma visibilidad que el bot. sourceSha256 sólo si quien pregunta puede leer el código.
      x-min-role: visitor
      security: []
      parameters: [{ $ref: '#/components/parameters/BotId' }, { $ref: '#/components/parameters/Version' }]
      responses:
        '200': { description: Versión, content: { application/json: { schema: { $ref: '#/components/schemas/BotVersionDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /bots/{botId}/versions/{version}/files:
    get:
      tags: [bots]
      operationId: getBotVersionFiles
      summary: Código de la versión decodificado en ficheros (mismas reglas que getBotSource).
      x-min-role: user
      parameters: [{ $ref: '#/components/parameters/BotId' }, { $ref: '#/components/parameters/Version' }]
      responses:
        '200':
          description: Ficheros
          content:
            application/json:
              schema:
                type: object
                properties:
                  botId: { type: string }
                  version: { type: integer }
                  sourceSha256: { type: string }
                  packaged: { type: boolean, description: 'false si el código se pegó como un único fichero y se envolvió en el esqueleto' }
                  files: { type: array, items: { type: object, properties: { path: { type: string }, content: { type: string } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /bots/{botId}/versions/{version}/artifact:
    get:
      tags: [bots]
      operationId: getBotVersionArtifact
      summary: Metadatos del artefacto firmado DE ESTA versión (sin los bytes). Misma visibilidad que el bot.
      x-min-role: visitor
      security: []
      parameters: [{ $ref: '#/components/parameters/BotId' }, { $ref: '#/components/parameters/Version' }]
      responses:
        '200': { description: Artefacto, content: { application/json: { schema: { $ref: '#/components/schemas/BotArtifact' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /bots/{botId}/versions/{version}/diff:
    get:
      tags: [bots]
      operationId: diffBotVersions
      summary: Diff unificado por fichero entre la versión `against` y esta. Exige poder leer el código de ambas.
      x-min-role: user
      parameters:
        - { $ref: '#/components/parameters/BotId' }
        - { $ref: '#/components/parameters/Version' }
        - { name: against, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Diff
          content:
            application/json:
              schema:
                type: object
                properties:
                  botId: { type: string }
                  from: { type: integer }
                  to: { type: integer }
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string }
                        status: { enum: [added, removed, modified, unchanged] }
                        additions: { type: integer }
                        deletions: { type: integer }
                        diff: { type: string, description: 'Diff unificado (vacío si unchanged)' }
        '400': { description: 'against ausente o inválido', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /bots/{botId}/versions/{version}/actions/clone:
    post:
      tags: [bots]
      operationId: cloneBotVersion
      summary: |
        «Nueva versión desde ésta»: crea la versión siguiente en draft con el MISMO código y runtime
        (y el loadout de origen o `loadoutRevision`), con parentVersion = version. La original no cambia.
      x-min-role: developer
      parameters: [{ $ref: '#/components/parameters/BotId' }, { $ref: '#/components/parameters/Version' }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { loadoutRevision: { type: integer } } }
      responses:
        '201': { description: Versión creada, content: { application/json: { schema: { $ref: '#/components/schemas/BotVersion' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # -------- Transiciones de estado del capítulo 17.1 (acciones explícitas)
  /bots/{botId}/versions/{version}/actions/submit:
    post:
      tags: [bots]
      operationId: submitBotVersion
      summary: 'draft → validating. Lanza el pipeline de bot-manager (E6/T6.1).'
      x-min-role: developer
      parameters: [{ $ref: '#/components/parameters/BotId' }, { $ref: '#/components/parameters/Version' }]
      responses:
        '202': { description: Pipeline encolado, content: { application/json: { schema: { $ref: '#/components/schemas/Build' } } } }
        '409': { $ref: '#/components/responses/IllegalTransition' }

  /bots/{botId}/versions/{version}/actions/publish:
    post:
      tags: [bots]
      operationId: publishBotVersion
      summary: 'validated → published. La versión pasa a ser INMUTABLE. codePublic es irreversible (D9).'
      x-min-role: developer
      parameters: [{ $ref: '#/components/parameters/BotId' }, { $ref: '#/components/parameters/Version' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                codePublic: { type: boolean, default: false }
      responses:
        '200': { description: Publicada, content: { application/json: { schema: { $ref: '#/components/schemas/BotVersion' } } } }
        '409': { $ref: '#/components/responses/IllegalTransition' }

  /bots/{botId}/versions/{version}/actions/suspend:
    post:
      tags: [admin]
      operationId: suspendBotVersion
      summary: 'cualquiera → suspended. Motivo obligatorio. Queda en audit_log y bloquea su ejecución (E6/T6.4).'
      x-min-role: moderator
      parameters: [{ $ref: '#/components/parameters/BotId' }, { $ref: '#/components/parameters/Version' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string, maxLength: 256 } }
      responses:
        '200': { description: Suspendida, content: { application/json: { schema: { $ref: '#/components/schemas/BotVersion' } } } }

  /bots/{botId}/versions/{version}/actions/retire:
    post:
      tags: [bots]
      operationId: retireBotVersion
      summary: 'published → retired. No admite inscripciones nuevas; conserva historial.'
      x-min-role: developer
      parameters: [{ $ref: '#/components/parameters/BotId' }, { $ref: '#/components/parameters/Version' }]
      responses:
        '200': { description: Retirada, content: { application/json: { schema: { $ref: '#/components/schemas/BotVersion' } } } }
        '409': { $ref: '#/components/responses/IllegalTransition' }

  # ---------------------------------------------------------------- BUILDS
  /builds/{buildId}:
    get:
      tags: [builds]
      operationId: getBuild
      summary: Estado y etapas del pipeline. Los logs solo los ve el dueño (o moderador/admin).
      x-min-role: developer
      parameters: [{ $ref: '#/components/parameters/BuildId' }]
      responses:
        '200': { description: Build, content: { application/json: { schema: { $ref: '#/components/schemas/Build' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------------------------ MAPS
  /maps:
    get:
      tags: [maps]
      operationId: listMaps
      summary: 'Versiones de mapa. FC-C · los borradores solo aparecen para su dueño (o admin); mine=true filtra los del solicitante.'
      x-min-role: visitor
      security: []
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: mine, in: query, required: false, schema: { type: string, enum: ['true'] } }
      responses:
        '200': { description: Mapas, content: { application/json: { schema: { $ref: '#/components/schemas/MapPage' } } } }
    post:
      tags: [maps]
      operationId: importMap
      summary: 'Importar un TMX o un mapa interno. Se valida (E4/T4.2); si hay errores, 422 y NO se crea.'
      x-min-role: user
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201': { description: Mapa en borrador, content: { application/json: { schema: { $ref: '#/components/schemas/MapVersion' } } } }
        '422': { $ref: '#/components/responses/MapInvalid' }

  /maps/drafts:
    post:
      tags: [maps]
      operationId: saveMapDraft
      summary: 'Guardar el progreso del editor visual (R10 slice 2) como borrador. Se valida (E4/T4.2) pero NO se gatea: se persiste con warnings o incluso errores, junto con los checks para que el editor los muestre. FC-C · si la última versión del mapa es un borrador se reescribe EN SITIO (200); si no, se crea una versión nueva en draft (201). Solo el dueño del mapa (o admin): un mapa ajeno es 403.'
      x-min-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Mapa interno (InternalMap), additionalProperties: true }
      responses:
        '200':
          description: Borrador existente reescrito en sitio (misma versión), con el feedback de validación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MapVersion' }
        '201':
          description: Borrador guardado, con el feedback de validación
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MapVersion'
                  - type: object
                    properties:
                      checks:
                        type: array
                        items:
                          type: object
                          properties:
                            check: { enum: [geometry, navigation, playability, balance, mode, destruction] }
                            severity: { enum: [error, warning] }
                            message: { type: string }
        '400':
          description: El cuerpo no tiene forma de mapa (mapId, dimensiones, layers)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /maps/{mapId}/versions/{version}:
    get:
      tags: [maps]
      operationId: getMapVersion
      x-min-role: visitor
      security: []
      parameters: [{ $ref: '#/components/parameters/MapId' }, { $ref: '#/components/parameters/Version' }]
      responses:
        '200': { description: Mapa, content: { application/json: { schema: { $ref: '#/components/schemas/MapVersion' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [maps]
      operationId: replaceMapVersion
      summary: 'SIEMPRE 409: una versión publicada es inmutable (cap. 14.2). Existe para documentar el rechazo.'
      x-min-role: admin
      parameters: [{ $ref: '#/components/parameters/MapId' }, { $ref: '#/components/parameters/Version' }]
      responses:
        '409': { $ref: '#/components/responses/Immutable' }

  /maps/{mapId}/versions/{version}/content:
    get:
      tags: [maps]
      operationId: getMapVersionContent
      summary: 'FC-C · Documento completo (InternalMap) de una versión, para reabrirla en el editor o exportarla. Misma visibilidad que getMapVersion (un borrador ajeno es 404).'
      x-min-role: visitor
      security: []
      parameters: [{ $ref: '#/components/parameters/MapId' }, { $ref: '#/components/parameters/Version' }]
      responses:
        '200': { description: Mapa interno, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /maps/{mapId}/versions/{version}/actions/publish:
    post:
      tags: [maps]
      operationId: publishMapVersion
      summary: 'Congela contenido y checksum, y genera miniatura. Solo si la validación pasó sin errores. FC-C · la publica el dueño del mapa; organizer+ puede publicar cualquiera (curación).'
      x-min-role: user
      parameters: [{ $ref: '#/components/parameters/MapId' }, { $ref: '#/components/parameters/Version' }]
      responses:
        '200': { description: Publicado, content: { application/json: { schema: { $ref: '#/components/schemas/MapVersion' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/IllegalTransition' }

  /maps/generate:
    post:
      tags: [maps]
      operationId: generateMap
      summary: 'Generación procedural determinista (E4/T4.4): mismos parámetros y semilla ⇒ mismo checksum.'
      x-min-role: organizer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [params, seed]
              properties:
                params: { type: object, additionalProperties: true }
                seed: { type: string }
      responses:
        '201': { description: Mapa generado y validado, content: { application/json: { schema: { $ref: '#/components/schemas/MapVersion' } } } }

  # --------------------------------------------------------------- CATALOG
  /catalog/versions:
    get:
      tags: [catalog]
      operationId: listCatalogVersions
      x-min-role: visitor
      security: []
      responses:
        '200':
          description: Versiones de catálogo (una temporada congela una, cap. 10.4)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CatalogVersion' } }
    post:
      tags: [admin]
      operationId: importCatalogVersion
      summary: 'Importar un catálogo desde los JSON versionados del repo. Idempotente; NUNCA sobrescribe una versión existente.'
      x-min-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [catalogVersion, modules]
              properties:
                catalogVersion: { type: string }
                modules: { type: array, items: { type: object, additionalProperties: true } }
      responses:
        '201': { description: Importado }
        '409': { $ref: '#/components/responses/Immutable' }

  /rulesets:
    get:
      tags: [catalog]
      operationId: listRulesets
      summary: 'FC-C (TD-003) · Rulesets REALES de la tabla rulesets y modos de plataforma. La web elige de aquí (sin ids hardcodeados). ?mode=X devuelve los de ese modo y los agnósticos (mode null).'
      x-min-role: visitor
      security: []
      parameters:
        - name: mode
          in: query
          required: false
          schema: { enum: [deathmatch, team_deathmatch, capture_the_flag, zone_control] }
      responses:
        '200':
          description: Rulesets y modos
          content:
            application/json:
              schema:
                type: object
                required: [modes, items]
                properties:
                  modes: { type: array, items: { enum: [deathmatch, team_deathmatch, capture_the_flag, zone_control] } }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name, mode, budgetCredits]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        mode: { type: string, nullable: true }
                        engineRulesetId: { type: string, nullable: true }
                        budgetCredits: { type: integer }
                        forbiddenCategories: { type: array, items: { type: string } }
        '400': { description: mode inválido, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /catalog/{catalogVersion}/modules:
    get:
      tags: [catalog]
      operationId: listModules
      x-min-role: visitor
      security: []
      parameters:
        - name: catalogVersion
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Definiciones de módulo del catálogo
          content:
            application/json:
              schema: { type: array, items: { type: object, additionalProperties: true } }

  # ------------------------------------------------------------ TOURNAMENTS
  /tournaments:
    get:
      tags: [tournaments]
      operationId: listTournaments
      x-min-role: visitor
      security: []
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { description: Torneos, content: { application/json: { schema: { $ref: '#/components/schemas/TournamentPage' } } } }
    post:
      tags: [tournaments]
      operationId: createTournament
      x-min-role: organizer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TournamentInput' }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/Tournament' } } } }

  /tournaments/{tournamentId}/entries:
    post:
      tags: [tournaments]
      operationId: enterTournament
      summary: 'Inscribir un bot. Congela la combinación exacta de versión de código + revisión de loadout (cap. 17.2).'
      x-min-role: user
      parameters: [{ $ref: '#/components/parameters/TournamentId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [botId, version]
              properties:
                botId: { type: string }
                version: { type: integer }
      responses:
        '201': { description: Inscrito, content: { application/json: { schema: { $ref: '#/components/schemas/Entry' } } } }
        '409': { description: 'Inscripciones cerradas, bot no publicado o suspendido', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /tournaments/{tournamentId}/actions/close-entries:
    post:
      tags: [tournaments]
      operationId: closeEntries
      summary: 'Cierra inscripciones, congela versiones, revela las semillas del commit-reveal y genera el calendario (E9/T9.4).'
      x-min-role: organizer
      parameters: [{ $ref: '#/components/parameters/TournamentId' }]
      responses:
        '200': { description: Cerrado y calendario generado, content: { application/json: { schema: { $ref: '#/components/schemas/Tournament' } } } }
        '409': { $ref: '#/components/responses/IllegalTransition' }

  /tournaments/{tournamentId}/actions/dry-run:
    post:
      tags: [tournaments]
      operationId: dryRunTournament
      summary: 'Simulacro con bots de ejemplo antes de un torneo público (mejora E9.M). No afecta a ratings.'
      x-min-role: organizer
      parameters: [{ $ref: '#/components/parameters/TournamentId' }]
      responses:
        '202': { description: Simulacro encolado }

  /tournaments/{tournamentId}/matches:
    get:
      tags: [tournaments]
      operationId: listTournamentMatches
      summary: >-
        R12 (slice 1, solo lectura) · Cuadro del torneo: matches ordenados por
        ronda y slot, con su emparejamiento y ganador si ya lo tienen. Proyección
        explícita de columnas; NUNCA viajan seeds ni seed_commitment (esos son
        del torneo, no del match, y esta ruta no los toca).
      x-min-role: visitor
      security: []
      parameters: [{ $ref: '#/components/parameters/TournamentId' }]
      responses:
        '200':
          description: Cuadro del torneo (matches por ronda/slot)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TournamentMatches' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --------------------------------------------------------------- BATTLES
  /public/battles/live:
    get:
      tags: [battles]
      operationId: listPublicLiveBattles
      summary: 'R11 · Batallas en directo, SOLO campos públicos, sin cuenta. Gateado por S9_PUBLIC_SPECTATE_ENABLED (apagado por defecto: enabled=false, battles=[]).'
      x-min-role: visitor
      security: []
      responses:
        '200':
          description: Estado de la emisión pública y batallas en directo (si está activada)
          content:
            application/json: { schema: { $ref: '#/components/schemas/PublicLiveBattles' } }
  /public/battles/{battleId}:
    get:
      tags: [battles]
      operationId: getPublicLiveBattle
      summary: >-
        R11 · Estado público de UNA batalla, SOLO campos públicos, sin cuenta.
        Gateado por S9_PUBLIC_SPECTATE_ENABLED: apagado → 404 (a diferencia del
        listado, un recurso por-id no revela enabled:false ni si el id existe).
        Encendido: 404 si la batalla no existe o no está `running` (una batalla
        no visible en directo no es públicamente consultable por id); 200 con
        la proyección pública si está `running`.
      x-min-role: visitor
      security: []
      parameters: [{ $ref: '#/components/parameters/BattleId' }]
      responses:
        '200':
          description: Batalla en directo (proyección pública)
          content:
            application/json: { schema: { $ref: '#/components/schemas/PublicLiveBattle' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /public/replays:
    get:
      tags: [battles]
      operationId: listPublicReplays
      summary: >-
        R11 · Listado de batallas FINALIZADAS con replay publicado, SOLO campos
        públicos, sin cuenta. Gateado por S9_PUBLIC_REPLAYS_ENABLED (apagado por
        defecto: enabled=false, items=[], igual que listPublicLiveBattles).
        Paginado por cursor opaco; límite acotado a 50 por página (más estricto
        que el límite general de 100) para no dar un vector de scraping barato.
      x-min-role: visitor
      security: []
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Estado de la publicación y batallas finalizadas con replay (si está activada)
          content:
            application/json: { schema: { $ref: '#/components/schemas/PublicReplayList' } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /public/replays/{battleId}:
    get:
      tags: [battles]
      operationId: getPublicReplay
      summary: >-
        R11 · Datos públicos de UNA batalla FINALIZADA con replay publicado,
        SOLO campos públicos, sin cuenta. Gateado por S9_PUBLIC_REPLAYS_ENABLED:
        apagado → 404 siempre (igual patrón que getPublicLiveBattle: un recurso
        por-id no distingue "capability apagada" de "no existe"). Encendido →
        404 si la batalla no existe, no está `finished` o no tiene replay
        publicado (nunca se revela su estado real a un visitante anónimo).
      x-min-role: visitor
      security: []
      parameters: [{ $ref: '#/components/parameters/BattleId' }]
      responses:
        '200':
          description: Batalla finalizada (proyección pública)
          content:
            application/json: { schema: { $ref: '#/components/schemas/PublicReplayBattle' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /public/replays/{battleId}/download:
    get:
      tags: [battles]
      operationId: downloadPublicReplay
      summary: >-
        R11 · Descarga del archivo de replay de una batalla FINALIZADA, sin
        cuenta. Mismo gate y mismas condiciones que getPublicReplay (apagado o
        batalla no finalizada/sin replay → 404).
      x-min-role: visitor
      security: []
      parameters: [{ $ref: '#/components/parameters/BattleId' }]
      responses:
        '200':
          description: Archivo de replay (binario)
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /battles:
    get:
      tags: [battles]
      operationId: listBattles
      summary: Batallas en directo, programadas y terminadas que el solicitante puede ver
      description: |
        UX-D (G-08 · TD-047) · Política de lectura de batallas (apps/api/src/battle-access.ts, que
        reutiliza la de replays): staff (rol >= organizer) · dueño de un bot participante · miembro
        del equipo de un bot participante no privado · cualquiera SÓLO si la batalla no tiene bots
        no públicos y (S9_PUBLIC_REPLAYS_ENABLED y está finished) o (S9_PUBLIC_SPECTATE_ENABLED y
        está running). Fuera de eso, 404 idéntico al de un id inexistente. Cache-Control: private, no-store.
      x-min-role: visitor
      security: []
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - name: status
          in: query
          schema: { enum: [scheduled, running, finished, failed] }
      responses:
        '200': { description: Batallas, content: { application/json: { schema: { $ref: '#/components/schemas/BattlePage' } } } }
    post:
      tags: [battles]
      operationId: createPracticeBattle
      summary: Lanzar una batalla privada de prueba (no afecta al rating)
      x-min-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PracticeBattleInput' }
      responses:
        '202': { description: Encolada (la ejecuta el tournament-worker con el código real de cada bot), content: { application/json: { schema: { $ref: '#/components/schemas/Battle' } } } }
        '400': { description: Modo/participantes/team/ruleset/mapa inválidos o bot repetido, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'bot_not_found · un bot inexistente o privado ajeno (TD-005); indistinguibles a propósito', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'bot_not_published · ruleset_mode_mismatch · map_mode_unsupported (checkBattleContent, misma regla que la web)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /battles/{battleId}:
    get:
      tags: [battles]
      operationId: getBattle
      summary: Una batalla (misma política de lectura que listBattles)
      description: |
        UX-D (G-08 · TD-047) · Política de lectura de batallas (apps/api/src/battle-access.ts, que
        reutiliza la de replays): staff (rol >= organizer) · dueño de un bot participante · miembro
        del equipo de un bot participante no privado · cualquiera SÓLO si la batalla no tiene bots
        no públicos y (S9_PUBLIC_REPLAYS_ENABLED y está finished) o (S9_PUBLIC_SPECTATE_ENABLED y
        está running). Fuera de eso, 404 idéntico al de un id inexistente. Cache-Control: private, no-store.
      x-min-role: visitor
      security: []
      parameters: [{ $ref: '#/components/parameters/BattleId' }]
      responses:
        '200': { description: Batalla, content: { application/json: { schema: { $ref: '#/components/schemas/Battle' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /battles/{battleId}/run:
    post:
      tags: [battles]
      operationId: runBattle
      summary: |
        DEV-B (TD-002) · DEPRECADO como ejecutor: ya NO ejecuta. Delega en la autoridad única de
        ejecución (tournament-worker): se asegura de que el trabajo `run_battle` está encolado
        (idempotente, dedupe_key `run_battle:<id>`) y responde 202. POST /battles ya lo encola.
      x-min-role: user
      parameters: [{ $ref: '#/components/parameters/BattleId' }]
      responses:
        '202':
          description: Delegada en la cola del tournament-worker
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: La batalla no está scheduled, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /battles/{battleId}/spectate-ticket:
    post:
      tags: [battles]
      operationId: getSpectateTicket
      summary: |
        Ticket de un solo uso para abrir el WebSocket de espectador en el gateway.
        El canal de espectador transporta ÚNICAMENTE snapshots públicos: nunca observaciones
        privadas de bots (D8, criterio del cap. 28). UX-D (G-08): sólo para quien puede leer la
        batalla (misma política que getBattle); sin sesión, además, exige S9_PUBLIC_SPECTATE_ENABLED.
      x-min-role: visitor
      security: []
      parameters: [{ $ref: '#/components/parameters/BattleId' }]
      responses:
        '201':
          description: Ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: { type: string }
                  wsUrl: { type: string }
                  expiresAt: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /battles/{battleId}/audit:
    get:
      tags: [battles]
      operationId: getBattleAudit
      summary: |
        Todo lo necesario para re-simular y verificar la batalla (E9/T9.4): versiones de motor,
        física, reglas y catálogo; checksum del mapa; hashes y firmas de los artefactos de bots;
        semilla y su prueba de commit-reveal. La auditabilidad no exige revelar código. UX-D (G-08):
        la ve quien puede leer la batalla (misma política que getBattle).
      x-min-role: visitor
      security: []
      parameters: [{ $ref: '#/components/parameters/BattleId' }]
      responses:
        '200': { description: Auditoría, content: { application/json: { schema: { $ref: '#/components/schemas/BattleAudit' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /battles/{battleId}/stats:
    get:
      tags: [battles]
      operationId: getBattleStats
      summary: Estadísticas por bot, equipo, módulo y mapa (cap. 20.3) y diagnóstico de TUS bots
      description: |
        Misma política de lectura que getBattle. `perBot` (deportivo) lo ve quien ve la batalla;
        `diagnostics` (UX-06) sólo trae los bots del solicitante (o todos para el staff): nunca los
        de un rival. TD-065: `status` = ready | pending (aún no calculadas: batalla en curso o job de
        stats sin terminar) | unavailable (sin replay: walkover, fallo deportivo, fallida). Nunca se
        cachea (private, no-store).
      x-min-role: visitor
      security: []
      parameters: [{ $ref: '#/components/parameters/BattleId' }]
      responses:
        '200': { description: Estadísticas, content: { application/json: { schema: { $ref: '#/components/schemas/BattleStats' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # --------------------------------------------------------------- REPLAYS
  # PRC (TD-004) · Política de acceso (apps/api/src/replay-access.ts), común a
  # todas las rutas /replays*: staff (rol >= organizer) · dueño de un bot
  # participante · miembro del equipo de un bot participante no privado ·
  # cualquiera SÓLO si S9_PUBLIC_REPLAYS_ENABLED y la batalla está finished sin
  # bots no públicos. Fuera de eso, 404 idéntico al de un id inexistente.
  # Respuestas con Cache-Control: private, no-store.
  /replays:
    get:
      tags: [replays]
      operationId: listReplays
      summary: Replays que el solicitante puede ver (más recientes primero); sustituye al inventario anónimo del replay-service
      x-min-role: user
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Replays visibles para el solicitante
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        battleId: { type: string }
                        ticks: { type: integer }
                        winner: { type: string }
                        official: { type: boolean }
                        createdAt: { type: string, format: date-time }
                        sizeBytes: { type: integer }
                  nextCursor: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /replays/{battleId}:
    get:
      tags: [replays]
      operationId: getReplay
      summary: Replay de datos (no vídeo), comprimido. Sujeto a la política de acceso a replays (404 si no es visible)
      x-min-role: visitor
      security: []
      parameters: [{ $ref: '#/components/parameters/BattleId' }]
      responses:
        '200':
          description: Replay
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /replays/{battleId}/index:
    get:
      tags: [replays]
      operationId: getReplayIndex
      summary: Índice del replay (keyframes, resultado, nómina) para el reproductor. Sujeto a la política de acceso a replays
      x-min-role: visitor
      security: []
      parameters: [{ $ref: '#/components/parameters/BattleId' }]
      responses:
        '200': { description: Índice del replay, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /replays/{battleId}/segment:
    get:
      tags: [replays]
      operationId: getReplaySegment
      summary: Segmento decodificado por rango de ticks (salto temporal). Sujeto a la política de acceso a replays
      x-min-role: visitor
      security: []
      parameters:
        - { $ref: '#/components/parameters/BattleId' }
        - { name: fromTick, in: query, schema: { type: integer, minimum: 0 } }
        - { name: toTick, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { description: Segmento, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '400': { description: rango de ticks inválido, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /replays/{battleId}/verify:
    post:
      tags: [replays]
      operationId: verifyReplay
      summary: Re-simula el replay con la versión registrada del motor y compara resultado y hashes. Sujeto a la política de acceso a replays
      x-min-role: visitor
      security: []
      parameters: [{ $ref: '#/components/parameters/BattleId' }]
      responses:
        '200':
          description: Resultado de la verificación
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches: { type: boolean }
                  officialHash: { type: string }
                  recomputedHash: { type: string }
                  valid: { type: boolean }
                  reason: { type: string, description: "checksum_mismatch, corrupt_file, engine_version_mismatch, final_state_hash_mismatch_with_db" }
                  message: { type: string, description: "Explicación para personas (p. ej. replay grabado con otra versión del motor: no verificable, no manipulado)" }
                  divergedAtTick: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------- STANDINGS
  /standings:
    get:
      tags: [standings]
      operationId: getStandings
      x-min-role: visitor
      security: []
      parameters:
        - name: seasonId
          in: query
          description: 'STAT_SEASON (TD-029) · ausente o "current" = temporada activa (season.ts); la respuesta la indica en X-S9-Season.'
          schema: { type: string }
        - name: mode
          in: query
          schema: { enum: [deathmatch, team_deathmatch, capture_the_flag, zone_control] }
      responses:
        '200':
          description: Clasificación
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Standing' } }

  /bots/{botId}/rating-history:
    get:
      tags: [standings]
      operationId: getBotRatingHistory
      summary: >-
        H6 (issue #10) · Historial público de rating del bot: el libro mayor
        rating_events de E9 (before/delta/after por batalla oficial, con K y
        reversiones). Con `?at=` incluye además el rating reconstruido a esa
        fecha (ratingAt de E9).
      x-min-role: visitor
      security: []
      parameters:
        - $ref: '#/components/parameters/BotId'
        - name: seasonId
          in: query
          description: 'STAT_SEASON (TD-029) · ausente o "current" = temporada activa.'
          schema: { type: string, default: current }
        - name: mode
          in: query
          schema: { enum: [deathmatch, team_deathmatch, capture_the_flag, zone_control], default: deathmatch }
        - name: at
          in: query
          description: Fecha para la reconstrucción histórica (rating vigente en ese instante).
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Historial de rating del bot en la temporada/modo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RatingHistory' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tournaments/{tournamentId}/team-standings:
    get:
      tags: [tournaments, standings]
      operationId: getTeamStandings
      summary: >-
        H6 (issue #10) · Clasificación por EQUIPOS de un torneo de formato
        `teams` (la tabla de liga real de E9 con sus desempates: puntos →
        enfrentamiento directo → diferencia de puntuación → seed). E7 la dejó
        pendiente de contrato.
      x-min-role: visitor
      security: []
      parameters: [{ $ref: '#/components/parameters/TournamentId' }]
      responses:
        '200':
          description: Tabla por equipos del torneo
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TeamStanding' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El torneo no es de formato por equipos
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  # ------------------------------------------------------------------ ADMIN
  /admin/security-findings:
    get:
      tags: [admin]
      operationId: listSecurityFindings
      summary: Hallazgos del sandbox y del escaneo de secretos (E6/T6.4). Nunca visibles para otros roles.
      x-min-role: admin
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200':
          description: Hallazgos
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SecurityFinding' } }

  /admin/audit-log:
    get:
      tags: [admin]
      operationId: listAuditLog
      summary: 'Registro de auditoría. Es de SOLO INSERCIÓN: no existe operación de borrado ni edición (E6/T6.4).'
      x-min-role: admin
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200':
          description: Entradas
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }

  # --------------------------------------------------------------- SYSTEM (R8)
  /system/status:
    get:
      tags: [system]
      operationId: getSystemStatus
      summary: 'R8.6 · Estado agregado de operación (solo lectura): conteos por estado, salud de BD, entorno y política de runtime. No expone secretos ni permite acciones.'
      x-min-role: admin
      responses:
        '200':
          description: Estado del sistema
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemStatus' }

  /system/rbac:
    get:
      tags: [system]
      operationId: getRbacMatrix
      summary: 'R8.9 · Matriz de roles y permisos derivada del contrato (solo lectura): roles con rango y endpoint→rol mínimo. Sin datos de usuarios.'
      x-min-role: admin
      responses:
        '200':
          description: Roles y matriz de permisos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RbacMatrix' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Cursor: { name: cursor, in: query, schema: { type: string }, description: Cursor opaco de paginación }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    UserId: { name: userId, in: path, required: true, schema: { type: string } }
    TeamId: { name: teamId, in: path, required: true, schema: { type: string } }
    BotId: { name: botId, in: path, required: true, schema: { type: string } }
    BuildId: { name: buildId, in: path, required: true, schema: { type: string } }
    MapId: { name: mapId, in: path, required: true, schema: { type: string } }
    BattleId: { name: battleId, in: path, required: true, schema: { type: string } }
    TournamentId: { name: tournamentId, in: path, required: true, schema: { type: string } }
    SessionId: { name: sessionId, in: path, required: true, schema: { type: string } }
    Version: { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }

  responses:
    Unauthorized:
      description: Credenciales ausentes o inválidas
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Rol insuficiente o recurso ajeno
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: No existe o no es visible para el solicitante
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Conflicto de estado
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    IllegalTransition:
      description: 'Transición de estado ilegal (cap. 17.1). El cuerpo indica estado actual y transiciones permitidas.'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  currentState: { $ref: '#/components/schemas/BotState' }
                  allowedTransitions: { type: array, items: { type: string } }
    Immutable:
      description: El recurso está publicado o congelado y es inmutable. Cree una versión nueva.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    LoadoutInvalid:
      description: 'El loadout viola una o más reglas de ensamblaje (cap. 10.2). Devuelve los códigos del validador de E3.'
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, const: loadout_invalid }
              violations:
                type: array
                items:
                  type: object
                  required: [code, message]
                  properties:
                    code:
                      enum: [slot_type_mismatch, slot_size_exceeded, unknown_slot, duplicate_slot, mass_exceeded, energy_deficit, budget_exceeded, incompatible_ammo, incompatible_chassis, duplicate_limit_exceeded, category_forbidden_by_ruleset, module_cost_cap_exceeded]
                    moduleId: { type: string }
                    slot: { type: string }
                    message: { type: string }
    MapInvalid:
      description: 'El mapa no supera el validador (cap. 14.3). Nunca llega a publicarse.'
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, const: map_invalid }
              checks:
                type: array
                items:
                  type: object
                  properties:
                    check: { enum: [geometry, navigation, playability, balance, mode, destruction] }
                    severity: { enum: [error, warning] }
                    message: { type: string }
    TooManyRequests:
      description: Límite de peticiones superado
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string, description: Código estable, apto para máquinas }
        message: { type: string, description: Explicación legible }
        correlationId: { type: string, description: Enlaza con los logs estructurados (cap. 24) }

    Role:
      enum: [visitor, user, developer, team_captain, organizer, moderator, admin]

    Visibility:
      enum: [private, team, public]

    Runtime:
      enum: [python, node]

    BotState:
      enum: [draft, validating, rejected, validated, published, frozen, suspended, retired]
      description: Estados del capítulo 17.1

    User:
      type: object
      properties:
        id: { type: string }
        displayName: { type: string }
        email: { type: string, format: email, x-private: true }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' }, x-private: true }
        twoFactorEnabled: { type: boolean, x-private: true }
        createdAt: { type: string, format: date-time }

    PublicProfile:
      type: object
      description: Proyección pública de un usuario. No contiene ningún campo x-private.
      properties:
        id: { type: string }
        displayName: { type: string }
        createdAt: { type: string, format: date-time }

    Session:
      type: object
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        userAgent: { type: string }

    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12, x-private: true }
        displayName: { type: string, maxLength: 48 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, x-private: true }
        totp: { type: string, pattern: '^[0-9]{6}$' }

    TokenPair:
      type: object
      properties:
        accessToken: { type: string, x-private: true }
        refreshToken: { type: string, x-private: true }
        expiresIn: { type: integer, description: Segundos de vida del access token (corta duración, cap. 16.1) }

    Team:
      type: object
      description: 'FC-C (TD-011) · sin identificadores de usuarios para anónimos o ajenos; members/bots solo para miembros o staff.'
      properties:
        id: { type: string }
        name: { type: string }
        memberCount: { type: integer }
        botCount: { type: integer }
        isCaptain: { type: boolean, description: Relativo al solicitante autenticado }
        isMember: { type: boolean, description: Relativo al solicitante autenticado }
        members:
          type: array
          items:
            type: object
            properties:
              userId: { type: string }
              displayName: { type: string }
              role: { enum: [captain, member] }
        bots:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              mine: { type: boolean }
    TeamPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Team' } }
        nextCursor: { type: string }

    Bot:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        ownerId: { type: string }
        teamId: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
        latestPublishedVersion: { type: integer }
        rating: { type: number }
        createdAt: { type: string, format: date-time }
    BotPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Bot' } }
        nextCursor: { type: string }

    BotVersion:
      type: object
      properties:
        botId: { type: string }
        version: { type: integer }
        state: { $ref: '#/components/schemas/BotState' }
        runtime: { $ref: '#/components/schemas/Runtime' }
        loadoutRevision: { type: integer }
        artifactHash: { type: string, description: 'sha256 del artefacto firmado. Público: permite auditar sin revelar código.' }
        codePublic: { type: boolean, description: 'Irreversible una vez publicada (D9).' }
        rejectionReason: { type: string }
        createdAt: { type: string, format: date-time }
        id: { type: string, description: 'bot_versions.id (uuid); la clave natural es (botId, version)' }
        parentVersion: { type: integer, description: 'Versión de la que se creó (clonado), si aplica' }
        validatedBuildId: { type: string, description: 'Build que produjo el artefacto de esta versión' }
        publishedAt: { type: string, format: date-time }

    BotArtifact:
      type: object
      properties:
        botId: { type: string }
        version: { type: integer }
        hash: { type: string, description: 'sha256 del paquete canónico arena-artifact/v1 (NO es un digest de imagen)' }
        signature: { type: string, description: 'Firma ed25519 del servicio sobre hash' }
        sizeBytes: { type: integer }
        buildId: { type: string }
        createdAt: { type: string, format: date-time }

    BotVersionDetail:
      allOf:
        - { $ref: '#/components/schemas/BotVersion' }
        - type: object
          properties:
            sourceSha256: { type: string, description: 'Sólo si quien pregunta puede leer el código' }
            canReadSource: { type: boolean }
            latestBuild: { $ref: '#/components/schemas/Build' }
            artifact: { $ref: '#/components/schemas/BotArtifact' }
            childVersions: { type: array, items: { type: integer } }

    LoadoutInput:
      type: object
      required: [chassis, modules]
      properties:
        name: { type: string, maxLength: 64 }
        catalogVersion: { type: string }
        chassis: { type: string }
        modules:
          type: array
          items:
            type: object
            required: [slot, moduleId]
            properties:
              slot: { type: string }
              moduleId: { type: string }
              ammo: { type: string }

    Loadout:
      allOf:
        - $ref: '#/components/schemas/LoadoutInput'
        - type: object
          properties:
            loadoutId: { type: string }
            revision: { type: integer }
            summary:
              type: object
              description: Resultado de resolveVehicle (E3/T3.3). Público, como el loadout (D9).
              properties:
                massKg: { type: number }
                costCredits: { type: number }
                energyBalanceEUs: { type: number }

    Build:
      type: object
      properties:
        id: { type: string }
        botId: { type: string }
        version: { type: integer }
        status: { enum: [queued, running, passed, failed] }
        stages:
          type: array
          description: Etapas del pipeline del capítulo 18.1, en orden
          items:
            type: object
            properties:
              name:
                enum: [structure, static_analysis, dependencies, build, protocol_test, smoke_battle, resource_limits, secret_scan, sign, publish]
              status: { enum: [pending, running, passed, failed, skipped] }
              message: { type: string }
              logUrl: { type: string, x-private: true, description: Solo dueño, moderador o admin }
        artifactHash: { type: string }
        createdAt: { type: string, format: date-time }

    MapVersion:
      type: object
      properties:
        mapId: { type: string }
        name: { type: string, description: 'FC-C · meta.name del documento' }
        mine: { type: boolean, description: 'FC-C · true si el solicitante es el dueño del mapa' }
        version: { type: integer }
        state: { enum: [draft, validated, published] }
        checksum: { type: string }
        widthM: { type: number }
        heightM: { type: number }
        supportedModes: { type: array, items: { type: string } }
        thumbnailUrl: { type: string }
        generation:
          type: object
          properties:
            seed: { type: string }
            generator: { type: string }
    MapPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MapVersion' } }
        nextCursor: { type: string }

    CatalogVersion:
      type: object
      properties:
        catalogVersion: { type: string }
        moduleCount: { type: integer }
        frozen: { type: boolean }
        importedAt: { type: string, format: date-time }

    TournamentInput:
      type: object
      required: [name, format, mode, rulesetId]
      properties:
        name: { type: string, maxLength: 64 }
        format: { enum: [league, round_robin, single_elimination, double_elimination, swiss, teams] }
        mode: { enum: [deathmatch, team_deathmatch, capture_the_flag, zone_control] }
        rulesetId: { type: string }
        budgetCredits:
          type: integer
          minimum: 200
          maximum: 5000
          default: 1000
          description: >-
            Presupuesto de créditos por loadout para esta competición (D7). Perilla de dificultad:
            una liga "skirmish" puede fijar 600, una "asedio" 2000. Si se omite, se usa el valor
            por defecto del ruleset (BUDGET_CREDITS_MVP=1000). Se congela para todas las batallas
            del torneo al cerrar inscripciones (E9/T9.4) y es igual para todos los participantes.
        catalogVersion: { type: string }
        mapPool: { type: array, items: { type: string } }
        roundsPerPairing: { type: integer, minimum: 1, description: 'Con intercambio de lados (cap. 19.2)' }
        entriesCloseAt: { type: string, format: date-time }
        seedCommitment:
          type: string
          description: 'Hash del lote de semillas, publicado ANTES del cierre (commit-reveal, E9/T9.4).'

    Tournament:
      allOf:
        - $ref: '#/components/schemas/TournamentInput'
        - type: object
          properties:
            id: { type: string }
            state: { enum: [draft, open, closed, running, finished, cancelled] }
            seedsRevealed: { type: array, items: { type: string }, description: 'Se rellena al cerrar inscripciones.' }
    TournamentPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Tournament' } }
        nextCursor: { type: string }

    Entry:
      type: object
      properties:
        id: { type: string }
        tournamentId: { type: string }
        botId: { type: string }
        version: { type: integer }
        loadoutRevision: { type: integer }
        frozen: { type: boolean, description: 'Congelado al cerrar inscripciones: la combinación código+loadout ya no cambia (cap. 17.2).' }

    PracticeBattleInput:
      type: object
      required: [mode, rulesetId, mapId, participants]
      properties:
        mode: { enum: [deathmatch, team_deathmatch, capture_the_flag, zone_control] }
        rulesetId: { type: string }
        mapId: { type: string }
        mapVersion: { type: integer }
        seed: { type: string }
        participants:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: object
            required: [botId, version, team]
            properties:
              botId: { type: string }
              version: { type: integer }
              team: { type: string }

    Battle:
      type: object
      properties:
        id: { type: string }
        tournamentId: { type: string }
        status: { enum: [scheduled, running, finished, failed] }
        official: { type: boolean, description: 'Las no oficiales no afectan al rating.' }
        mode: { type: string }
        mapId: { type: string }
        mapVersion: { type: integer }
        rulesetId: { type: string }
        mapName: { type: string, description: 'UX-D · nombre del mapa para la UI.' }
        createdAt: { type: string, format: date-time }
        participants:
          type: array
          items:
            type: object
            properties:
              botId: { type: string }
              botName: { type: string, description: 'UX-D · nombre del bot (la UI no muestra UUIDs).' }
              version: { type: integer, description: 'Versión EXACTA que jugó.' }
              team: { type: string }
              outcome: { enum: [win, loss, draw, disqualified] }
              diagnosticsVisible: { type: boolean, description: 'UX-D · el solicitante (dueño o staff) puede ver el diagnóstico de este bot.' }
              cpuMs: { type: number, nullable: true, description: 'CPU real del contenedor del bot (ms, cgroup). null = no medida O no eres su dueño (diagnóstico, TD-047).' }
        result:
          type: object
          description: 'BATTLE_RESULT v1 (docs/technical/battles.md). El ganador POR BOT es participants[].outcome.'
          properties:
            schema: { enum: [battle-result/v1] }
            winner: { type: string, description: 'Equipo ganador o "draw".' }
            score: { type: object, additionalProperties: { type: number } }
            ticks: { type: integer }
            disqualified: { type: array, items: { type: string } }
            endReason: { enum: [completed, walkover, sporting_failure] }
            agents: { enum: [container, in_process_stub, scripted], description: 'Quién condujo los vehículos (container = código real del bot).' }
        failureKind:
          enum: [none, bot_timeout, bot_crash, infrastructure]
          description: 'Distingue derrota deportiva de fallo técnico (cap. 19.2). Solo infrastructure se reintenta.'
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        replayAvailable: { type: boolean }
        replayHash: { type: string }
    BattleStats:
      type: object
      description: 'UX-D · Respuesta de getBattleStats.'
      properties:
        battleId: { type: string }
        status: { enum: [ready, pending, unavailable] }
        perBot:
          type: object
          description: 'Por botId: stats deportivas (replay-service/src/stats.ts) + botName y version. Sin cpuMs, decisions ni rejectionsByReason (diagnóstico); decisionTimeouts y perModule.*.rejections sólo para el dueño y el staff (UX-F, DEF-R12).'
          additionalProperties:
            type: object
            additionalProperties: true
            properties:
              shotsFired: { type: integer }
              shotsHit: { type: integer }
              accuracy: { type: number, nullable: true }
              damageDealt: { type: number }
              damageTaken: { type: number }
              kills: { type: integer }
              died: { type: boolean }
              survivedTicks: { type: integer }
              decisionTimeouts: { type: integer }
              distanceM: { type: number, description: 'Recorrido en metros (entre snapshots públicos).' }
              perModule:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    moduleId: { type: string, nullable: true }
                    usesKind: { enum: [shots, mines, move_commands, radio_messages, passive], description: 'Qué cuenta uses; passive = el módulo actúa solo (uses 0 por definición).' }
                    uses: { type: integer }
                    rejections: { type: integer }
                    damageDealt: { type: number }
                    efficiency: { type: number, nullable: true }
                    finalState: { type: string }
        diagnostics:
          type: object
          description: 'UX-06 · Por botId, SÓLO los bots del solicitante (todos para staff). null en un campo = no medido.'
          additionalProperties: { $ref: '#/components/schemas/BotDiagnostics' }
    BotDiagnostics:
      type: object
      description: 'UX-06 · Diagnóstico de un bot en una batalla. Códigos y contadores; nunca detalles del sandbox.'
      properties:
        botId: { type: string }
        botName: { type: string }
        version: { type: integer }
        measured: { type: boolean, description: 'El ejecutor registró arranque/protocolo (false en batallas anteriores).' }
        startup:
          type: object
          nullable: true
          properties:
            ok: { type: boolean }
            reason: { enum: [bot_execution_timeout, bot_crash] }
        hello:
          type: object
          nullable: true
          properties:
            ok: { type: boolean }
            tick: { type: integer, nullable: true }
            reconnects: { type: integer, nullable: true }
        decisions: { type: integer, nullable: true, description: 'COMMAND aplicados por el motor.' }
        decisionTimeouts: { type: integer, nullable: true }
        maxConsecutiveTimeouts: { type: integer, nullable: true, description: 'Límite de timeouts seguidos que descalifica.' }
        disqualified: { type: boolean }
        disqualifiedReason: { type: string, nullable: true, description: "consecutive_timeouts | bot_execution_timeout | bot_crash | startup_failed | administrative | unknown" }
        commands:
          type: object
          nullable: true
          properties:
            received: { type: integer, nullable: true }
            invalid: { type: integer, nullable: true, description: 'COMMAND que no validan contra el esquema (el bot recibe rejected_action invalid_command).' }
            firstInvalidReason: { type: string, nullable: true, description: 'Ruta JSON y regla del primer COMMAND inválido.' }
            invalidJson: { type: integer, nullable: true }
            late: { type: integer, nullable: true }
            wrongTick: { type: integer, nullable: true }
            extra: { type: integer, nullable: true }
        rejectionsByReason: { type: object, nullable: true, additionalProperties: { type: integer }, description: 'cooldown, no_ammo, no_energy, out_of_arc, module_destroyed…' }
        disconnectedAtTick: { type: integer, nullable: true }
        container:
          type: object
          nullable: true
          properties:
            exitCode: { type: integer, nullable: true }
            oomKilled: { type: boolean }
            exitedDuringBattle: { type: boolean }
        cpuMs: { type: number, nullable: true }
        shotsFired: { type: integer, nullable: true }
        shotsHit: { type: integer, nullable: true }
        damageDealt: { type: number, nullable: true }
    BattlePage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Battle' } }
        nextCursor: { type: string }

    PublicLiveBattle:
      type: object
      description: 'R11 · Proyección PÚBLICA de una batalla en directo. Nunca incluye seed, tickets ni datos de propietario.'
      properties:
        id: { type: string }
        status: { enum: [running] }
        mode: { type: string }
        mapId: { type: string }
        mapName: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    PublicLiveBattles:
      type: object
      description: 'R11 · Respuesta 200 SIEMPRE. Si la capability está apagada: enabled=false, battles=[].'
      properties:
        enabled: { type: boolean, description: 'Lectura de S9_PUBLIC_SPECTATE_ENABLED.' }
        battles: { type: array, items: { $ref: '#/components/schemas/PublicLiveBattle' } }

    PublicReplayBattle:
      type: object
      description: >-
        R11 · Proyección PÚBLICA de una batalla FINALIZADA con replay. Nunca
        incluye seed, seedCommitment, seedRevealProof, tickets ni datos de
        propietario. `participants` solo lleva identidad pública del bot y su
        resultado deportivo, nunca artefactos ni credenciales.
      properties:
        id: { type: string }
        status: { enum: [finished] }
        mode: { type: string }
        mapId: { type: string }
        mapName: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        participants:
          type: array
          items:
            type: object
            properties:
              botId: { type: string }
              version: { type: integer }
              team: { type: string }
              outcome: { enum: [win, loss, draw, disqualified] }
        result:
          type: object
          properties:
            score: { type: object, additionalProperties: { type: number } }
            ticks: { type: integer }
        replayAvailable: { type: boolean }
    PublicReplayList:
      type: object
      description: 'R11 · Respuesta 200 SIEMPRE. Si la capability está apagada: enabled=false, items=[].'
      properties:
        enabled: { type: boolean, description: 'Lectura de S9_PUBLIC_REPLAYS_ENABLED.' }
        items: { type: array, items: { $ref: '#/components/schemas/PublicReplayBattle' } }
        nextCursor: { type: string }

    BattleAudit:
      type: object
      description: Suficiente para re-simular y verificar la batalla sin revelar código privado.
      properties:
        battleId: { type: string }
        seed: { type: string }
        seedCommitment: { type: string }
        seedRevealProof: { type: string }
        versions:
          type: object
          properties:
            engine: { type: string }
            physics: { type: string }
            rules: { type: string }
            catalog: { type: string }
            protocol: { type: string }
        map:
          type: object
          properties:
            mapId: { type: string }
            version: { type: integer }
            checksum: { type: string }
        artifacts:
          type: array
          items:
            type: object
            properties:
              botId: { type: string }
              version: { type: integer }
              artifactHash: { type: string }
              signature: { type: string }
        finalStateHash: { type: string }

    Standing:
      type: object
      properties:
        rank: { type: integer }
        botId: { type: string, nullable: true, description: 'UX-F (DEF-R3) · null si es un bot privado que el solicitante no puede identificar' }
        botName: { type: string, description: '«Bot privado» si el solicitante no puede identificarlo' }
        private: { type: boolean, description: 'true = bot no identificable para el solicitante' }
        rating: { type: number }
        wins: { type: integer }
        losses: { type: integer }
        draws: { type: integer }

    # H6 (issue #10) · Evento del libro mayor de rating de E9 (rating_events).
    RatingEvent:
      type: object
      required: [battleId, botVersion, k, before, delta, after, reverted, at]
      properties:
        battleId: { type: string }
        botVersion: { type: integer }
        k: { type: number, description: Factor K vigente al aplicar (configurable por liga) }
        before: { type: number }
        delta: { type: number }
        after: { type: number }
        reverted: { type: boolean, description: 'true si la batalla fue anulada y el delta revertido' }
        at: { type: string, format: date-time }

    RatingHistory:
      type: object
      required: [botId, seasonId, mode, rating, events]
      properties:
        botId: { type: string }
        seasonId: { type: string }
        mode: { type: string }
        rating: { type: number, description: 'Rating vigente (1000 si el bot aún no tiene eventos)' }
        ratingAt: { type: number, description: 'Solo si se pidió ?at=: rating reconstruido a esa fecha' }
        events: { type: array, items: { $ref: '#/components/schemas/RatingEvent' } }

    # H6 (issue #10) · Fila de la tabla por equipos (leagueTable de E9, isTeams).
    TeamStanding:
      type: object
      required: [rank, teamId, points, wins, losses, draws, scoreDiff]
      properties:
        rank: { type: integer }
        teamId: { type: string }
        teamName: { type: string }
        points: { type: integer, description: 'Liga: victoria 3, empate 1 (formats.ts de E9)' }
        wins: { type: integer }
        losses: { type: integer }
        draws: { type: integer }
        scoreDiff: { type: number, description: Diferencia de puntuación agregada de las series }
        seed: { type: integer, description: Orden de inscripción (último desempate) }

    # R12 (slice 1, solo lectura) · Fila del cuadro de torneo (tabla matches,
    # migración 008_e9_competition). Proyección explícita: nunca seed/seed_commitment
    # (eso es del torneo, no del match).
    TournamentMatch:
      type: object
      required: [id, round, slot, pairing, state, final]
      properties:
        id: { type: string }
        round: { type: integer }
        slot: { type: string, nullable: true, description: 'Identificador único del hueco en el cuadro (matches_tournament_slot_idx)' }
        pairing: { type: object, additionalProperties: true, description: 'Fuentes del emparejamiento (home/away/round/slot), estructura del bracket' }
        state: { enum: [scheduled, running, finished, failed] }
        winnerBotId: { type: string, nullable: true, description: 'UX-F (DEF-R3) · null también si el ganador es un bot privado ajeno (winnerPrivate)' }
        winnerPrivate: { type: boolean, description: 'el ganador es un bot que el solicitante no puede identificar' }
        winnerTeamId: { type: string, nullable: true }
        final: { type: boolean, description: 'true si es la final del torneo (modo visible, cap. 19.1)' }

    TournamentMatches:
      type: object
      required: [matches]
      properties:
        matches: { type: array, items: { $ref: '#/components/schemas/TournamentMatch' } }

    SecurityFinding:
      type: object
      properties:
        id: { type: string }
        kind: { enum: [sandbox_escape_attempt, forbidden_dependency, secret_in_source, resource_limit_exceeded, protocol_abuse] }
        botId: { type: string }
        version: { type: integer }
        severity: { enum: [low, medium, high, critical] }
        detail: { type: string }
        detectedAt: { type: string, format: date-time }

    AuditEntry:
      type: object
      properties:
        id: { type: string }
        actorId: { type: string }
        action: { type: string }
        target: { type: string }
        correlationId: { type: string }
        at: { type: string, format: date-time }

    SystemStatus:
      type: object
      description: 'Estado agregado de operación. Solo booleanos/conteos; nunca valores secretos.'
      properties:
        env: { type: string, description: 'NODE_ENV o "unknown".' }
        commit: { type: string, description: 'SHA de despliegue si está disponible, o "unknown".' }
        databaseOk: { type: boolean }
        realRunnerEnabled:
          type: boolean
          description: 'Lectura de S9_RUN_REAL_DOCKER_E2E. Si es false, la ejecución real de batallas no está disponible en este entorno.'
        smokeDigestConfigured:
          type: boolean
          description: 'true si SMOKE_BOT_DIGEST está definido. NO se expone el valor.'
        publicSpectateEnabled:
          type: boolean
          description: 'R11 · Lectura de S9_PUBLIC_SPECTATE_ENABLED: si es false, /public/battles/live responde enabled=false, battles=[].'
        publicReplaysEnabled:
          type: boolean
          description: 'R11 · Lectura de S9_PUBLIC_REPLAYS_ENABLED: si es false, /public/replays responde enabled=false, items=[].'
        battlesByStatus: { type: object, additionalProperties: { type: integer } }
        buildsByStatus: { type: object, additionalProperties: { type: integer } }
        botVersionsByState: { type: object, additionalProperties: { type: integer } }
        readyBots: { type: integer, description: 'Versiones de bot publicadas (jugables).' }
        publishedMaps: { type: integer }
        runtimePolicy: { $ref: '#/components/schemas/RuntimePolicyInvariants' }
    RuntimePolicyInvariants:
      type: object
      description: 'Invariantes de seguridad del runtime que la plataforma SIEMPRE exige (solo lectura). Los límites numéricos se configuran en infraestructura (ver docs/ops).'
      properties:
        privileged: { type: boolean, description: 'Siempre false.' }
        dockerSocketMounted: { type: boolean, description: 'Siempre false.' }
        seccompEnforced: { type: boolean, description: 'Siempre true.' }
        digestRequired: { type: boolean, description: 'Siempre true.' }
        signatureRequired: { type: boolean, description: 'Siempre true.' }
        networkMode: { type: string, description: 'Red dedicada de la arena (nunca host).' }

    RbacMatrix:
      type: object
      properties:
        roles: { type: array, items: { $ref: '#/components/schemas/RbacRole' } }
        endpoints: { type: array, items: { $ref: '#/components/schemas/RbacEndpoint' } }
    RbacRole:
      type: object
      properties:
        name: { type: string }
        rank: { type: integer }
    RbacEndpoint:
      type: object
      properties:
        operationId: { type: string }
        method: { type: string }
        path: { type: string }
        minRole: { type: string }
