# CI del monorepo — dosier 22.3, ocho etapas (E10 T10.1).
#
# Etapas: 1 lint+formato+tipos · 2 unitarias · 3 esquemas y compatibilidad ·
# 4 batallas deterministas de regresión · 5 build de imágenes · 6 escaneo ·
# 7 despliegue a staging · 8 humo y promoción manual a producción ·
# 9 semáforo (R2.2, ERR-GES-05).
#
# Semáforo (job `semaforo`, lógica testeable en infrastructure/scripts/ci-gate.mjs):
#   🟢 VERDE    todo ejecutado y aprobado (y en main, staging con evidencia real).
#   🟡 AMARILLO pruebas bien pero entorno externo no disponible (p. ej. sin
#               STAGING_HOST): el trabajo se reporta OMITIDO, nunca aprobado.
#   🔴 ROJO     fallo funcional o de seguridad → el job semaforo FALLA y la
#               promoción queda bloqueada.
# Actions no admite conclusión "neutral" en jobs de workflow, así que el
# amarillo se materializa como check-run "Semáforo CI" neutral (vía API) +
# summary + ::warning::; el detalle está en docs/ronda2/reportes/R2.2-semaforo-ci.md.
#
# Presupuesto: la CI de un PR (etapas 1–6) debe tardar < 15 min. Las 1000
# batallas y las suites lentas van a nightly.yml.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Node >= 22.15: la suite usa zstdCompressSync (falla en Node 20, ver docs/entrega-E10.md).
  NODE_VERSION: "22.15"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ── Etapa 1: lint, formato y tipos ─────────────────────────────────────────
  lint-format-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint de determinismo (nada de reloj real/Math.random en src/sim)
        run: npm run lint
      - name: Tipos (tsc --noEmit, BLOQUEANTE — R2.1, cierra H7/issue #11)
        # ERR-GES-02: apps/web tiene su propio proyecto (jsx) y queda excluido
        # del tsconfig raíz. ERR-GES-03: los 29 errores genuinos se corrigieron
        # en R2.1; desde entonces un error de tipos ROMPE la CI (sin
        # continue-on-error). Ambos proyectos deben dar 0 errores.
        run: npm run typecheck
      - name: Formato (prettier --check, BLOQUEANTE — R2.1)
        # ERR-GES-05: formateador real. Ámbito en .prettierignore (solo código
        # TS/JS; arena-engine entra cuando se fusione R2.7).
        run: npm run format:check

  # ── Etapa 2: pruebas unitarias ─────────────────────────────────────────────
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Espacios de nombres de usuario sin privilegios (los exige el guard del entrypoint)
        # B13 · infrastructure/tests/{replays-volume,b13-data-volumes}.test.ts
        # ejecutan el entrypoint COMO uid 0 dentro de `unshare -rm` + chroot: es
        # la única forma de probar de verdad el guard contra enlaces simbólicos
        # sin privilegios reales. En las imágenes ubuntu-24.04 de los runners,
        # AppArmor bloquea los userns sin privilegios, así que esos tests salían
        # rojos o verdes SEGÚN QUÉ RUNNER TOCARA (el PR #86 pasó; este falló con
        # el mismo código). Se habilita explícitamente y se COMPRUEBA: si aquí no
        # hay userns, el job muere con esta causa a la vista en vez de dejar el
        # guard sin probar. Es el runner efímero de la CI, no un servidor.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare -rm /bin/true
          echo "userns sin privilegios: disponible"
      - name: Unitarias (apps, packages e infrastructure) con cobertura
        # R2.1 (ERR-GES-05): cobertura V8 sobre las unitarias; el informe HTML
        # y el resumen se publican como artefacto de CI.
        # R2.2: se añade infrastructure/ — sus tests (escáner de Compose,
        # ci-gate, backup, observabilidad) no corrían en NINGUNA etapa de ci.yml.
        # fix/backup-sftp-scheduled-runtime: backup-sftp-e2e.test.ts se EXCLUYE
        # de aquí a propósito — construye una imagen Docker y levanta 3
        # contenedores (backup + sftp con chroot + postgres), y correrlo junto
        # a --coverage.enabled/--maxWorkers=2 de esta etapa lo haría más lento
        # y más frágil sin aportar nada al informe de cobertura de código TS.
        # Corre en su propio job obligatorio: e2e-backup-sftp (más abajo).
        # fix/restore-sftp-bootstrap: restore-sftp-bootstrap.test.ts se
        # EXCLUYE por el mismo motivo exacto (imagen Docker + SFTP con
        # chroot + postgres) — corre en su propio job obligatorio:
        # e2e-restore-sftp-bootstrap (más abajo). Una primera versión de esa
        # suite intentó evitar Docker levantando un sshd suelto sin
        # privilegios directamente en este job; el propio runner de CI no
        # soporta el subsistema sftp de un sshd sin privilegios (confirmado
        # con diagnóstico real, ver ese fichero) — de ahí que use el mismo
        # arnés que ya funciona aquí en vez de reinventar uno nuevo.
        run: npx vitest run apps packages infrastructure --exclude "**/backup-sftp-e2e.test.ts" --exclude "**/restore-sftp-bootstrap.test.ts" --maxWorkers=2 --coverage.enabled --coverage.provider=v8 --coverage.reporter=text --coverage.reporter=html --coverage.reportsDirectory=coverage
      - name: Informe de cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

  # ── Etapa 2b: E2E real del backup por SFTP con chroot ──────────────────────
  # fix/backup-sftp-scheduled-runtime: el primer backup real se hizo A MANO
  # desde el host; el backup PROGRAMADO seguía roto por dos defectos que sólo
  # aparecían EJECUTANDO LA IMAGEN REAL (openssh-client ausente del
  # Dockerfile; la ruta del repositorio restic tenía que ser la de DENTRO del
  # chroot del host de respaldo, no la física). Un `restic … snapshots` a
  # mano desde el host nunca los reproducía. Job propio y obligatorio (no un
  # paso más de `unit`) para que sea imposible que se salte en silencio: si
  # Docker no estuviera disponible en este runner, infrastructure/tests/
  # backup-sftp-e2e.test.ts hace FALLAR el job a propósito en vez de
  # reportarse "skipped" (ver ese fichero, guarda en beforeAll con CI=true).
  # needs: build-images — REUTILIZA la imagen backup que ya construye la
  # etapa 5 (matrix.service == 'backup', exportada arriba como artefacto) en
  # vez de reconstruirla desde cero: más rápido (evita un segundo `apk add`
  # completo) y más fiel (ejercita el mismo artefacto que build-images ya
  # validó). scan también depende de build-images, así que esto no alarga el
  # camino crítico del pipeline.
  e2e-backup-sftp:
    needs: [unit, build-images]
    runs-on: ubuntu-latest
    # Medido en la primera ejecución real: con la imagen reutilizada (sin
    # reconstruirla) el E2E completo (pulls de atmoz/sftp + postgres, arranque,
    # entrypoint real, restic, 2 mutaciones sobre setup_ssh) debe caber
    # holgadamente en unos pocos minutos. 10 min de margen sobre eso; si algún
    # día hiciera falta más, que sea una decisión explícita con datos de
    # infrastructure/tests/backup-sftp-e2e.test.ts (imprime tiempos por fase),
    # no un número subido a ciegas.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Docker disponible en este runner (si esto falla, el job de abajo también debe fallar, nunca saltarse)
        run: docker info
      - name: Descargar la imagen backup ya construida por build-images
        uses: actions/download-artifact@v4
        with:
          name: backup-image-tar
          path: /tmp/backup-image
      - name: Cargar la imagen (ya viene etiquetada como s9-ai-arena/backup:e2e-test — no se retagea aquí, fuente única de verdad en build-images)
        # `docker load` imprime su propia salida ("Loaded image: ...") y aquí
        # además se lista `docker images` justo después — diagnóstico
        # permanente (pedido tras el fallo real de tag "No such image: …" en
        # una vuelta anterior): si el nombre alguna vez no coincidiera, el
        # log de ESTE paso lo dice de un vistazo, sin tener que reproducirlo.
        run: |
          docker load -i /tmp/backup-image/backup-image.tar
          echo "--- docker images tras la carga ---"
          docker images
          docker image inspect s9-ai-arena/backup:e2e-test >/dev/null
      - name: E2E real - imagen backup (reutilizada) + SFTP con chroot (atmoz/sftp) + postgres
        # Salida SIN búfer: el propio test escribe cada fase con fs.writeSync
        # (síncrono, no se pierde aunque el proceso muera después) para que un
        # futuro cuelgue diga EN QUÉ FASE se quedó, en vez de cancelarse en
        # silencio como pasó en la primera ejecución real (15 min, cero líneas).
        run: npx vitest run infrastructure/tests/backup-sftp-e2e.test.ts --maxWorkers=1

  # ── Etapa 2c: E2E real del bootstrap SSH de restore.sh por SFTP con chroot ──
  # fix/restore-sftp-bootstrap: restore.sh no sabía nada del backend sftp
  # (contenedor de recuperación nuevo, que nunca ejecutó backup.sh, sin
  # ~/.ssh → "Host key verification failed"). Mismo arnés EXACTO que
  # e2e-backup-sftp de arriba (mismo motivo: probarlo sin la imagen real y
  # sin un SFTP real es "funciona en el repo, falla en la imagen"). Una
  # primera versión de este job instalaba openssh-server/openssh-sftp-server
  # en el job `unit` y levantaba un sshd suelto sin privilegios en el propio
  # runner — funcionaba el namespace, funcionaba SSH, pero el subsistema
  # sftp de ESE sshd sin privilegios no arrancaba en este runner concreto de
  # GitHub Actions (confirmado con diagnóstico real: dpkg -L con la ruta
  # correcta, sftp -v autenticando y validando la huella, EOF sólo al pedir
  # el subsistema). Entorno del runner, no del código — se abandonó ese
  # camino en vez de insistir, y se movió aquí, al mismo arnés de Docker que
  # YA funciona en este repo para el mismo problema de fondo.
  # needs: build-images — REUTILIZA la MISMA imagen backup que e2e-backup-sftp
  # (mismo artefacto backup-image-tar), nunca la reconstruye.
  e2e-restore-sftp-bootstrap:
    needs: [unit, build-images]
    runs-on: ubuntu-latest
    # Mismo margen que e2e-backup-sftp: pulls de atmoz/sftp + postgres
    # (probablemente ya en caché de capas del runner tras e2e-backup-sftp,
    # pero no se asume), backup.sh real para producir un snapshot + 6
    # mutaciones sobre restore.sh, cada una con un `docker run --rm` nuevo.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Docker disponible en este runner (si esto falla, el job de abajo también debe fallar, nunca saltarse)
        run: docker info
      - name: Descargar la imagen backup ya construida por build-images
        uses: actions/download-artifact@v4
        with:
          name: backup-image-tar
          path: /tmp/backup-image
      - name: Cargar la imagen (ya viene etiquetada como s9-ai-arena/backup:e2e-test — no se retagea aquí, fuente única de verdad en build-images)
        run: |
          docker load -i /tmp/backup-image/backup-image.tar
          echo "--- docker images tras la carga ---"
          docker images
          docker image inspect s9-ai-arena/backup:e2e-test >/dev/null
      - name: E2E real - restore.sh en un contenedor de recuperación limpio (nunca ejecutó backup.sh) + SFTP con chroot (atmoz/sftp) + postgres
        # Mismo patrón de salida sin búfer que e2e-backup-sftp (fs.writeSync
        # síncrono) — ver el comentario de ese job para el incidente real que
        # lo motivó.
        run: npx vitest run infrastructure/tests/restore-sftp-bootstrap.test.ts --maxWorkers=1

  # ── Etapa 3: esquemas y compatibilidad de contratos ────────────────────────
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Contract tests de los SDKs (suite compartida JSON)
        run: npx vitest run sdks --maxWorkers=2
      - name: Contract tests del SDK Python
        run: |
          python -m pip install -e sdks/python[dev] 2>/dev/null || python -m pip install -e sdks/python pytest
          cd sdks/python && python -m pytest tests/ -q

  # ── Etapa 4: batallas deterministas de regresión (suites de E2) ────────────
  regression-battles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Goldens de física + determinismo (100 ejecuciones) + bots ejemplo
        run: npx vitest run apps/arena-engine/tests example-bots --maxWorkers=2

  # ── Etapa 5: build de imágenes ─────────────────────────────────────────────
  build-images:
    needs: [lint-format-types, unit, contracts, regression-battles]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # H4 (issue #8): TODAS las imágenes que construye el Compose. gateway,
        # arena-engine, web, streamer, backup y bot-runtime tienen Dockerfile
        # propio; bot-manager tiene el suyo (infrastructure/docker/bot-manager/
        # Dockerfile, B3: necesita python3 para el análisis AST de bots Python);
        # los demás usan la imagen genérica node-service con APP_PATH como
        # build-arg (mismos valores que infrastructure/docker-compose.yml).
        # El entrypoint (SERVICE_ENTRY) lo fija el Compose en despliegue; la imagen
        # construye igualmente y falla al arrancar con mensaje claro si aún no existe.
        #
        # B13 · Esta lista NO puede volver a quedarse corta a mano: el test
        # infrastructure/tests/ci-image-matrix.test.ts la compara con el
        # `build:` de cada servicio del Compose (Dockerfile Y build-args) y
        # falla si alguna imagen se queda sin construir o se construye con un
        # Dockerfile distinto al de producción. Hasta B13 faltaban `streamer`,
        # `backup` y `bot-runtime` —nadie validaba sus cambios— y `web` se
        # construía (y se publicaba en GHCR) desde node-service/Dockerfile
        # cuando el Compose la construye con docker/web/Dockerfile: la CI
        # validaba una imagen que no era la de producción.
        include:
          - service: gateway
            dockerfile: infrastructure/docker/gateway/Dockerfile
            build_args: ""
          - service: arena-engine
            dockerfile: infrastructure/docker/arena-engine/Dockerfile
            build_args: ""
          - service: web
            dockerfile: infrastructure/docker/web/Dockerfile
            build_args: ""
          - service: api
            dockerfile: infrastructure/docker/node-service/Dockerfile
            build_args: APP_PATH=apps/api
          - service: tournament-worker
            dockerfile: infrastructure/docker/node-service/Dockerfile
            build_args: APP_PATH=apps/tournament-worker
          - service: bot-manager
            dockerfile: infrastructure/docker/bot-manager/Dockerfile
            build_args: APP_PATH=apps/bot-manager
          - service: map-service
            dockerfile: infrastructure/docker/node-service/Dockerfile
            build_args: APP_PATH=apps/map-service
          - service: replay-service
            dockerfile: infrastructure/docker/node-service/Dockerfile
            build_args: APP_PATH=apps/replay-service
          # B13 · Las tres que NINGÚN job construía. `streamer` y `backup` se
          # despliegan en VM108 (perfiles streaming/production) y sus cambios
          # solo se descubrían en el `docker compose build` de producción;
          # `bot-runtime` es la plantilla de contenedor de bot del perfil bots.
          - service: streamer
            dockerfile: infrastructure/docker/streamer/Dockerfile
            build_args: ""
          - service: backup
            dockerfile: infrastructure/docker/backup/Dockerfile
            build_args: ""
          - service: bot-runtime-python
            dockerfile: infrastructure/docker/bot-runtime/Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@v4
      # fix/backup-sftp-scheduled-runtime: SÓLO para la variante `backup` de
      # la matriz. El driver `docker` por defecto (el builder que usa
      # docker/build-push-action sin este paso) NO soporta el exportador
      # `type=docker,dest=<tar>` que el paso de más abajo necesita para darle
      # la imagen a e2e-backup-sftp ("Docker exporter is not supported for
      # the docker driver" — fallo real visto en CI). `docker-container` sí
      # lo soporta. Se activa ANTES del build principal (no sólo antes del
      # de exportar) para que AMBOS pasos compartan builder y caché: si se
      # activara sólo para el export, ese build sería un cache-miss completo
      # y reintroduciría el mismo coste que se quería evitar. Acotado a
      # `matrix.service == 'backup'`: cada variante de la matriz corre en su
      # propio runner aislado, así que esto NO toca el driver de las otras
      # diez — nada que perder ahí.
      - name: Configurar buildx con driver docker-container (sólo backup; necesario para exportar a tar)
        if: matrix.service == 'backup'
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      - name: Login en GHCR (solo main)
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Versión del paquete
        id: ver
        run: echo "version=$(node -p "require('./package.json').version ?? '0.0.0'")" >> "$GITHUB_OUTPUT"
      - name: Build (y push etiquetado por versión y sha en main; digest lo publica el registro)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:v${{ steps.ver.outputs.version }}
      # fix/backup-sftp-scheduled-runtime: el E2E de infrastructure/tests/
      # backup-sftp-e2e.test.ts (job e2e-backup-sftp) necesita EXACTAMENTE
      # esta imagen. Su primera versión la reconstruía desde cero en su
      # propio job (FROM alpine + apk add restic/postgresql16-client/
      # openssh-client sin caché entre runs) y eso — sumado a los pulls de
      # atmoz/sftp y postgres — se llevaba minutos; la CI real lo canceló a
      # los 15 sin haber emitido una sola línea. Reconstruir la MISMA imagen
      # dos veces en dos jobs también era, en sí, redundante: ya se construye
      # aquí. Este paso la reexporta a un tar (cache-hit inmediato: mismo
      # builder docker-container, mismo contexto, ningún RUN/COPY cambia)
      # para que e2e-backup-sftp la cargue en vez de reconstruirla — más
      # rápido Y más fiel, porque ejercita el artefacto que de verdad se
      # publicaría (misma imagen, no una reconstruida aparte).
      # FALLO REAL VISTO EN CI (segunda vuelta de este mismo paso): sin
      # `tags:` aquí, `docker/build-push-action` no le pone NINGÚN nombre a
      # la imagen dentro del tar (queda "untagged", sólo con su ID de
      # contenido) — `docker load` la importa igual, pero no hay ningún
      # "ghcr.io/…/backup:sha-…" al que referirse después, porque ese nombre
      # nunca se compuso más que EN LA CABEZA de quien escribió el paso
      # siguiente. FUENTE ÚNICA DE VERDAD: se etiqueta aquí mismo con el tag
      # EXACTO y literal que infrastructure/tests/backup-sftp-e2e.test.ts usa
      # como IMAGE_TAG ("s9-ai-arena/backup:e2e-test") — así el paso de carga
      # de más abajo no tiene que RECOMPONER ningún nombre (ni con
      # github.sha, que en `pull_request` es el SHA del merge commit, no el
      # de la rama) ni retagear nada: `docker load` ya deja la imagen con el
      # nombre que el test espera, sin segunda fuente de verdad.
      - name: Exportar la imagen backup como artefacto (para e2e-backup-sftp; cache-hit, no reconstruye)
        if: matrix.service == 'backup'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          tags: s9-ai-arena/backup:e2e-test
          outputs: type=docker,dest=/tmp/backup-image.tar
      - name: Subir la imagen backup como artefacto
        if: matrix.service == 'backup'
        uses: actions/upload-artifact@v4
        with:
          name: backup-image-tar
          path: /tmp/backup-image.tar
          retention-days: 1

  # ── Etapa 6: escaneo de dependencias, imágenes y Compose ──────────────────
  scan:
    needs: [build-images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Auditoría de dependencias npm
        run: npm audit --audit-level=high
      - name: Escaneo del Compose (docker.sock / privilegiado, cap. 28) — BLOQUEANTE
        # R2.2 (fail-closed): antes había un `if: hashFiles(...)` que saltaba el
        # paso EN SILENCIO si el escáner no existía — un camino no verificable
        # presentado como verde. Ahora, sin escáner, el job falla (rojo).
        run: node infrastructure/scripts/scan-compose.mjs infrastructure/docker-compose.yml
      - name: Escaneo de vulnerabilidades del árbol (Trivy fs)
        # La 0.28.0 no existe: el job fallaba en seco con "Unable to resolve action"
        # desde antes de R6.1. Las versiones de esta accion llevan prefijo v.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # ── E12/T12.1: suite E2E del criterio de éxito del MVP (26.1) ─────────────
  # Definición operativa de "el MVP funciona": 6 pasos con evidencia (ids,
  # hashes, cifras) archivada como artefacto + 6 sabotajes deliberados.
  # Compone EN PROCESO las piezas reales (API E7 + pipeline E6 + motor E2 +
  # mapa E4 + catálogo E3 + gateway y stats E8). Cuando el operador configure
  # staging (STAGING_HOST), la etapa 8 añade el humo HTTP contra staging.
  e2e-mvp:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # DoD T12.1: duración total < 20 min
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Suite E2E del MVP (pasos 1-6 + 6 sabotajes)
        run: npx vitest run tests/e2e --maxWorkers=2
      - name: Evidencia de los 6 pasos como artefacto de CI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-mvp-evidence
          path: tests/e2e/evidence/
          if-no-files-found: warn

  # ── Etapa 7: despliegue a staging (solo main) ──────────────────────────────
  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: [scan, e2e-mvp]
    runs-on: ubuntu-latest
    environment: staging
    # R2.2: el job DECLARA lo que hizo de verdad. `resultado=desplegado` es la
    # única evidencia que el semáforo acepta como verde; `omitido` → AMARILLO.
    outputs:
      resultado: ${{ steps.deploy.outputs.resultado }}
    steps:
      - uses: actions/checkout@v4
      - name: Desplegar en staging (o declararse OMITIDO, nunca verde de mentira)
        id: deploy
        # PENDIENTE de entorno: requiere una VM de staging accesible y los
        # secretos STAGING_SSH_KEY/STAGING_HOST configurados por el operador
        # (docs/despliegue.md, sección "CI/CD"). R2.2 (ERR-GES-05): sin ellos el
        # despliegue queda registrado como OMITIDO (semáforo AMARILLO), no como
        # éxito — antes hacía `exit 0` y el run entero salía en verde.
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          if [ -z "$STAGING_HOST" ]; then
            echo "resultado=omitido" >> "$GITHUB_OUTPUT"
            echo "::warning::STAGING_HOST sin configurar: despliegue a staging OMITIDO (semáforo AMARILLO, docs/despliegue.md)."
            exit 0
          fi
          echo "Desplegando sha-${{ github.sha }} en $STAGING_HOST"
          # ssh deploy@$STAGING_HOST 'cd /opt/s9-ai-arena && git pull && \
          #   docker compose -f infrastructure/docker-compose.yml --profile production pull && \
          #   docker compose -f infrastructure/docker-compose.yml --profile production up -d'
          echo "resultado=desplegado" >> "$GITHUB_OUTPUT"

  # ── Etapa 8: humo en staging y promoción manual a producción ──────────────
  smoke-and-promote:
    if: github.ref == 'refs/heads/main'
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    # La promoción manual se implementa con "required reviewers" en el
    # environment `production` (configuración del repositorio; pasos del
    # operador en docs/despliegue.md). El job queda en espera hasta aprobación.
    environment: production
    outputs:
      resultado: ${{ steps.smoke.outputs.resultado }}
    steps:
      - uses: actions/checkout@v4
      - name: Humo E2E de staging y promoción (o declararse OMITIDO)
        id: smoke
        # R2.2: solo se promociona sobre un despliegue REAL. Si deploy-staging
        # se declaró omitido (o sin evidencia), el humo también queda OMITIDO
        # (semáforo AMARILLO) — antes hacía `exit 0` y salía en verde.
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          DEPLOY_RESULTADO: ${{ needs.deploy-staging.outputs.resultado }}
        run: |
          if [ "$DEPLOY_RESULTADO" != "desplegado" ] || [ -z "$STAGING_HOST" ]; then
            echo "resultado=omitido" >> "$GITHUB_OUTPUT"
            echo "::warning::Humo y promoción OMITIDOS: no hay despliegue real de staging que probar (deploy=${DEPLOY_RESULTADO:-sin-evidencia}; semáforo AMARILLO, docs/despliegue.md)."
            exit 0
          fi
          bash infrastructure/scripts/smoke.sh "https://$STAGING_HOST"
          echo "Promoción aprobada manualmente: desplegar en producción (mismo procedimiento que staging)."
          echo "resultado=promocionado" >> "$GITHUB_OUTPUT"

  # ── Etapa 9: semáforo (R2.2, ERR-GES-05) ───────────────────────────────────
  # Corre SIEMPRE (if: always()) y es el único veredicto fiable del run:
  # 🔴 falla el job (bloquea) · 🟡 job verde con check-run "Semáforo CI" en
  # neutral + warnings + summary (trabajo omitido, jamás contado como aprobado)
  # · 🟢 todo ejecutado de verdad. Lógica testeable en ci-gate.mjs
  # (tests: infrastructure/tests/ci-gate.test.ts).
  semaforo:
    if: always()
    needs:
      [
        lint-format-types,
        unit,
        e2e-backup-sftp,
        e2e-restore-sftp-bootstrap,
        contracts,
        regression-battles,
        build-images,
        scan,
        e2e-mvp,
        deploy-staging,
        smoke-and-promote,
      ]
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Evaluar semáforo (rojo = exit 1; amarillo = warnings + output)
        id: gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node infrastructure/scripts/ci-gate.mjs
      - name: Publicar check-run "Semáforo CI" (neutral si amarillo)
        # El amarillo "de verdad" de GitHub: un check-run con conclusión
        # `neutral` (gris, no verde). Se publica también en verde/rojo para que
        # el operador tenga UN indicador con el estado real del run.
        # continue-on-error: la fuente de verdad es el propio job `semaforo`
        # (exit/summary/warnings); si el token no puede crear checks (p. ej. un
        # PR de fork, token de solo lectura), el veredicto no se pierde.
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          COLOR: ${{ steps.gate.outputs.color || 'rojo' }}
        with:
          script: |
            const color = process.env.COLOR;
            const conclusion = { verde: "success", amarillo: "neutral", rojo: "failure" }[color] ?? "failure";
            const titulo = {
              verde: "VERDE: todo ejecutado y aprobado",
              amarillo: "AMARILLO: pruebas bien, pero hay trabajo OMITIDO por falta de entorno externo",
              rojo: "ROJO: fallo funcional o de seguridad — promoción bloqueada",
            }[color] ?? "ROJO: el gate no pudo evaluarse (fail-closed)";
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: context.payload.pull_request?.head?.sha ?? context.sha,
              name: "Semáforo CI",
              status: "completed",
              conclusion,
              output: { title: titulo, summary: `Detalle en el summary del job \`semaforo\` de este run. Lógica: infrastructure/scripts/ci-gate.mjs (R2.2).` },
            });
