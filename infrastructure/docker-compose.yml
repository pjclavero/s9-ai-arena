# ──────────────────────────────────────────────────────────────────────────────
# S9 AI Arena — stack Docker Compose único (dosier cap. 6; E10 T10.2/T10.3/T10.4)
#
# Perfiles (6.1):
#   development  desarrollo local (BD en contenedor)
#   production   producción (BD en contenedor)
#   external-db  producción con PostgreSQL externo vía DATABASE_URL (nota del 6.2):
#                el servicio postgres NO pertenece a este perfil y no arranca.
#   bots         plantilla de runtime de bots (contenedores efímeros, E6)
#   streaming    streamer Chromium+FFmpeg (E11)
#   observability  Prometheus+Grafana+Loki y exporters (cap. 24, opcional)
#
# Redes (6.4): public (solo gateway con acceso exterior), platform, arena,
#   build y data son `internal: true` (sin salida a Internet).
#   Excepciones documentadas de acople a `public` SIN publicar puertos (solo
#   salida a Internet, porque las redes internas no la tienen): streamer
#   (RTMPS hacia YouTube) y alertmanager (webhook/email del operador).
#
# Seguridad (cap. 28, R1.7/ERR-SEC-02): NINGÚN servicio corre privilegiado ni
#   monta docker.sock — sin excepciones. El bot-manager lanza contenedores a
#   través del proxy de la API de Docker que corre EN EL HOST
#   (apps/bot-manager/src/docker-proxy-main.ts; ver docs/despliegue.md), con
#   allowlist estricta (crear/arrancar/parar/inspeccionar). Lo verifica
#   infrastructure/scripts/scan-compose.mjs en la etapa 6 de la CI.
#
# Arranque: ver docs/despliegue.md (instalación limpia en 3 pasos).
# ──────────────────────────────────────────────────────────────────────────────

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    # Incluye el nombre del servicio en cada línea (attrs) para que Promtail
    # etiquete los logs sin necesitar docker.sock.
    labels: "com.docker.compose.service"

# Contrato de logging (cap. 24, ADR-010 D10.3): JSON por stdout con ts, level,
# service, msg y battle_id/bot_id/user_id/correlation_id cuando apliquen.

x-node-env: &node-db-env
  # Si DATABASE_URL está vacío, el servicio construye el DSN interno con
  # PGPASSWORD_FILE (nunca la contraseña en claro en el entorno).
  DATABASE_URL: ${DATABASE_URL:-}
  PGHOST: postgres
  PGUSER: arena
  PGDATABASE: arena
  PGPASSWORD_FILE: /run/secrets/postgres_password
  REDIS_URL: redis://queue:6379
  LOG_FORMAT: json

services:
  # ── gateway · Nginx, HTTPS, rutas y WebSocket. Único con puertos al exterior ─
  gateway:
    build:
      context: ..
      dockerfile: infrastructure/docker/gateway/Dockerfile
    image: ${IMAGE_PREFIX:-ghcr.io/pjclavero/s9-ai-arena}/gateway:${TAG:-latest}
    profiles: [nucleo, development, production, external-db]
    networks: [public, platform]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      S9_DOMAIN: ${S9_DOMAIN:-arena.local}
    volumes:
      # Modo (a) standalone: nginx.conf (TLS en el gateway, 80/443 al exterior).
      # Modo (b) detrás del proxy de VM104: GATEWAY_CONF=nginx-behind-proxy.conf
      # (solo HTTP a la LAN; VM104 termina TLS). Ver docs/despliegue.md.
      # Sintaxis larga: el default `${VAR:-...}` mete un ':' que la sintaxis corta
      # confunde con separador bajo `docker compose config --no-interpolate`
      # ("too many colons"). La forma larga es inmune y equivalente en runtime.
      - type: bind
        source: ./gateway/${GATEWAY_CONF:-nginx.conf}
        target: /etc/nginx/nginx.conf
        read_only: true
      - ./secrets/tls:/etc/nginx/tls:ro
    depends_on:
      web:
        condition: service_healthy
        required: false
      api:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  # ── web · panel, visor, editor y clasificación (E7/E8) ──────────────────────
  web:
    build:
      context: ..
      dockerfile: infrastructure/docker/web/Dockerfile
    image: ${IMAGE_PREFIX:-ghcr.io/pjclavero/s9-ai-arena}/web:${TAG:-latest}
    profiles: [nucleo, development, production, external-db]
    networks: [platform]
    environment:
      LOG_FORMAT: json
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  # ── api · usuarios, bots, mapas, torneos y administración (E7) ──────────────
  api:
    build:
      context: ..
      dockerfile: infrastructure/docker/node-service/Dockerfile
      args: { APP_PATH: apps/api }
    image: ${IMAGE_PREFIX:-ghcr.io/pjclavero/s9-ai-arena}/api:${TAG:-latest}
    profiles: [nucleo, development, production, external-db]
    networks: [platform, data]
    environment:
      <<: *node-db-env
      PORT: "8080"
      SERVICE_ENTRY: ${API_ENTRY:-apps/api/src/server.ts}
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      # R1.8 · ERR-SEC-05: saltos de proxy de confianza delante de la API.
      # En el stack SIEMPRE hay al menos el gateway (1). Detrás del Nginx de
      # VM104 (GATEWAY_CONF=nginx-behind-proxy.conf) son 2. Nunca "true".
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # B2 · launcher REAL de POST /battles/:id/run (API → arena-engine por HTTP,
      # red platform, NUNCA Docker). Solo se cablea si arena-engine responde con
      # AMBAS piezas presentes: URL (default seguro, solo un hostname interno,
      # sin secreto) y el secreto compartido POR ARCHIVO (patrón Docker secrets,
      # igual que jwt_secret) — nunca en claro en el entorno. Sin el secreto,
      # sigue en 503 runner_unavailable aunque S9_ENABLE_REAL_BATTLE_RUNS=1
      # (que sigue apagada por defecto y NO se enciende aquí).
      ARENA_ENGINE_URL: ${ARENA_ENGINE_URL:-http://arena-engine:8081}
      ARENA_ENGINE_SHARED_SECRET_FILE: /run/secrets/arena_engine_internal_secret
      S9_ENABLE_REAL_BATTLE_RUNS: ${S9_ENABLE_REAL_BATTLE_RUNS:-}
      # B6 · ingesta del replay REAL de una batalla containerizada en el
      # replay-service, para que quede visible en el visor web (que habla con
      # el replay-service vía el gateway, no con esta API). api y replay-service
      # ya comparten la red `platform` (ver el bloque replay-service más abajo);
      # no hace falta volumen ni red nuevos, solo esta URL interna. Opt-in: sin
      # ella, el comportamiento es igual que antes de B6 (replay.ingested: false
      # siempre). REPLAY_INGEST_REQUIRED en blanco = best-effort (por defecto):
      # un fallo de ingesta no tumba la batalla, solo se reporta honestamente.
      REPLAY_SERVICE_URL: ${REPLAY_SERVICE_URL:-http://replay-service:8083}
      REPLAY_INGEST_REQUIRED: ${REPLAY_INGEST_REQUIRED:-}
      # B8 · la ingesta de replays pasa a ser una ruta AUTENTICADA. El MISMO
      # fichero de secreto se monta aquí (productor) y en replay-service
      # (consumidor): así coinciden sin poner nada en claro en el entorno,
      # igual que arena_engine_internal_secret. Sin él, la ingesta responde 401
      # y se reporta `replay.ingested: false` (fail-closed, nunca se finge).
      REPLAY_INGEST_SECRET_FILE: /run/secrets/replay_ingest_secret
    secrets: [postgres_password, jwt_secret, arena_engine_internal_secret, replay_ingest_secret]
    volumes:
      # B7 · SOLO LECTURA, y justificado por el código: getReplay y
      # verifyReplay (apps/api/src/routes/battles.ts) hacen
      # `readFile(battle.replay_ref)` sobre la ruta ABSOLUTA que dejó el
      # almacén de E8 (`/data/replays/<battleId>.replay`). Sin este montaje esa
      # lectura es un ENOENT que la API traduce a 404 "Replay no disponible":
      # la descarga y la verificación de replays de torneo NUNCA han podido
      # funcionar en el stack. La API no escribe replays (la ingesta va por
      # HTTP a replay-service, REPLAY_SERVICE_URL), así que `:ro`.
      - arena_replays:/data/replays:ro
    depends_on:
      queue:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1G }
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  # ── arena-engine · una batalla autoritativa (E2/E5) ─────────────────────────
  arena-engine:
    build:
      context: ..
      dockerfile: infrastructure/docker/arena-engine/Dockerfile
    image: ${IMAGE_PREFIX:-ghcr.io/pjclavero/s9-ai-arena}/arena-engine:${TAG:-latest}
    profiles: [development, production, external-db]
    networks: [platform, arena]
    environment:
      PORT: "8081"
      # B1: entrypoint de SERVICIO (sirve /healthz y expone POST /run sobre
      # runContainerBattle).
      SERVICE_ENTRY: ${ENGINE_ENTRY:-apps/arena-engine/src/service.ts}
      LOG_FORMAT: json
      # B2 · ProxyContainerRunner (habla con s9-docker-proxy, NUNCA docker.sock)
      # SOLO se cablea si DOCKER_PROXY_URL está presente (sin valor por defecto
      # real aquí a propósito): sin configurar, /run sigue en 503
      # runner_unavailable. ARENA_NETWORK/ARENA_ENGINE_HOST tienen defaults
      # seguros (los mismos que ya usaba B1 como fallback en cfg). El secreto
      # interno de /run va POR ARCHIVO (mismo secreto Docker que usa la API para
      # llamar aquí — así ambos lados coinciden sin ponerlo en claro).
      DOCKER_PROXY_URL: ${DOCKER_PROXY_URL:-}
      ARENA_NETWORK: ${ARENA_NETWORK:-arena}
      ARENA_ENGINE_HOST: ${ARENA_ENGINE_HOST:-arena-engine}
      ARENA_ENGINE_INTERNAL_SECRET_FILE: /run/secrets/arena_engine_internal_secret
    secrets: [arena_engine_internal_secret]
    # B13 · SIN montajes de datos, a propósito. arena-engine montaba
    # arena_maps:/data/maps:ro, arena_replays:/data/replays y
    # arena_logs:/data/logs, y NINGÚN archivo de apps/arena-engine toca /data:
    # la única variable de entorno que lee su código es PORT (service.ts), los
    # mapas los sirve `fixtures.ts` / la copia de `maps/` que lleva la imagen, y
    # los logs salen por stdout (LOG_FORMAT=json, contrato de logging del cap.
    # 24). El replay de una batalla con contenedores lo devuelve
    # `runContainerBattle` en memoria y lo ingesta quien corresponde por HTTP.
    # Eran tres volúmenes rw/ro montados en un servicio que nunca los abre:
    # superficie para nada y, en el caso de arena_replays, un candidato a crear
    # el volumen con la propiedad equivocada antes que su dueño real.
    depends_on:
      queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "4.0", memory: 2G }
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  # ── tournament-worker · calendarios y batallas (E9) ─────────────────────────
  tournament-worker:
    build:
      context: ..
      dockerfile: infrastructure/docker/node-service/Dockerfile
      args: { APP_PATH: apps/tournament-worker }
    image: ${IMAGE_PREFIX:-ghcr.io/pjclavero/s9-ai-arena}/tournament-worker:${TAG:-latest}
    profiles: [nucleo, development, production, external-db]
    networks: [platform, data]
    environment:
      <<: *node-db-env
      SERVICE_ENTRY: ${WORKER_ENTRY:-apps/tournament-worker/src/main.ts}
      SPECTATE_PORT: "8081"
      REPLAYS_DIR: /data/replays
      # B7 · directorios de datos cuya propiedad ajusta el entrypoint de la
      # imagen antes de bajar a `node` (infrastructure/docker/node-service/
      # entrypoint.sh). Debe coincidir con REPLAYS_DIR.
      ARENA_DATA_DIRS: /data/replays
    secrets: [postgres_password]
    volumes:
      # B7 · ESCRITURA, y justificado por el código: finishBattle
      # (apps/tournament-worker/src/battle-runner.ts) llama a
      # `ingestReplay(replaysDir, …)` y guarda la ruta devuelta en
      # battles.replay_ref. El servicio declaraba REPLAYS_DIR=/data/replays
      # desde siempre pero NO montaba el volumen: escribía en el sistema de
      # ficheros efímero del contenedor y la API (otro contenedor) nunca
      # encontraba ese replay_ref. Mismo volumen y mismo punto de montaje que
      # api y replay-service: es la condición para que productor y consumidor
      # se vean.
      - arena_replays:/data/replays
    depends_on:
      queue:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      # Contrato: el worker toca /tmp/heartbeat en cada iteración del bucle.
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(cat /tmp/heartbeat 2>/dev/null || echo 0) )) -lt 120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1G }
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  # ── bot-manager · construye, valida y lanza contenedores de bots (E6) ───────
  # R1.7 (ERR-SEC-02): ya NO monta docker.sock (la antigua "excepción
  # documentada" era RCE→root del host en el servicio que procesa código de
  # usuario). Lanza contenedores a través del proxy de la API de Docker con
  # allowlist (crear/arrancar/parar/inspeccionar; rechaza privileged,
  # bind-mounts, red del host y cambios de usuario), que corre EN EL HOST:
  # apps/bot-manager/src/docker-proxy-main.ts (ver docs/despliegue.md). El
  # alias docker-proxy.internal apunta al host vía host-gateway; la
  # verificación viva de esa ruta queda para R-DEPLOY.
  # Aislamiento: redes platform+build (sin data → sin ruta a PostgreSQL ni al
  # backup), sin `secrets:` montados. Lo fija infrastructure/tests/
  # bot-manager-isolation.test.ts.
  # B3: imagen PROPIA (no la genérica node-service) porque el análisis AST de
  # bots Python necesita python3 (apps/bot-manager/src/ast-analysis.ts). Ver
  # infrastructure/docker/bot-manager/Dockerfile para el porqué.
  bot-manager:
    build:
      context: ..
      dockerfile: infrastructure/docker/bot-manager/Dockerfile
      args: { APP_PATH: apps/bot-manager }
    image: ${IMAGE_PREFIX:-ghcr.io/pjclavero/s9-ai-arena}/bot-manager:${TAG:-latest}
    profiles: [development, production, external-db]
    networks: [platform, build]
    environment:
      PORT: "8084"
      SERVICE_ENTRY: ${BOT_MANAGER_ENTRY:-apps/bot-manager/src/main.ts}
      LOG_FORMAT: json
      # R1.7: única vía hacia Docker; el socket ya no se monta.
      DOCKER_PROXY_URL: ${DOCKER_PROXY_URL:-http://docker-proxy.internal:2375}
    extra_hosts:
      - "docker-proxy.internal:host-gateway"
    volumes:
      - arena_bot_sources:/data/bot-sources
      - arena_build_cache:/data/build-cache
    depends_on:
      queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8084/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  # ── bot-build-worker · ejecuta el pipeline de build/análisis/firma (E6/R2.5) ─
  # R-DEPLOY · R2: proceso SEPARADO del bot-manager (API/control). El proceso de
  # la API solo ENCOLA builds (tabla `jobs`); ESTE los EJECUTA con el adaptador
  # real E6PipelineBotManager (apps/bot-manager/src/build-worker-main.ts). No
  # publica puertos ni monta docker.sock. FALLA CERRADO si falta la clave de
  # firma (ARTIFACT_SIGNING_KEY_FILE, ERR-SEC-15) o la config de BD. Vive en
  # platform+build+data: necesita la cola/BD (jobs) y el volumen de fuentes; NO
  # está en la red arena (no toca contenedores de bots: eso es del bot-manager).
  # B3: imagen PROPIA con python3 — es AQUÍ donde corre static_analysis de
  # verdad (el AST de bots Python). Ver infrastructure/docker/bot-manager/Dockerfile.
  bot-build-worker:
    build:
      context: ..
      dockerfile: infrastructure/docker/bot-manager/Dockerfile
      args: { APP_PATH: apps/bot-manager }
    image: ${IMAGE_PREFIX:-ghcr.io/pjclavero/s9-ai-arena}/bot-manager:${TAG:-latest}
    profiles: [development, production, external-db]
    networks: [platform, build, data]
    environment:
      <<: *node-db-env
      SERVICE_ENTRY: ${BOT_BUILD_WORKER_ENTRY:-apps/bot-manager/src/build-worker-main.ts}
      # Fallar cerrado en el arranque: sin clave de firma no hay pipeline que firmar.
      ARTIFACT_SIGNING_KEY_FILE: /run/secrets/artifact_signing_key
    secrets: [postgres_password, artifact_signing_key]
    volumes:
      - arena_bot_sources:/data/bot-sources
      - arena_build_cache:/data/build-cache
    depends_on:
      queue:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      # Contrato: el worker toca /tmp/heartbeat en cada iteración (< 120 s).
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(cat /tmp/heartbeat 2>/dev/null || echo 0) )) -lt 120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  # ── map-service · importa, valida, genera y versiona mapas (E4) ─────────────
  map-service:
    build:
      context: ..
      dockerfile: infrastructure/docker/node-service/Dockerfile
      args: { APP_PATH: apps/map-service }
    image: ${IMAGE_PREFIX:-ghcr.io/pjclavero/s9-ai-arena}/map-service:${TAG:-latest}
    profiles: [development, production, external-db]
    networks: [platform, data]
    environment:
      <<: *node-db-env
      PORT: "8082"
      SERVICE_ENTRY: ${MAP_SERVICE_ENTRY:-apps/map-service/src/main.ts}
    secrets: [postgres_password]
    volumes:
      - arena_maps:/data/maps
      - arena_assets:/data/assets:ro
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  # ── replay-service · guarda y sirve repeticiones (E2/E9) ────────────────────
  replay-service:
    build:
      context: ..
      dockerfile: infrastructure/docker/node-service/Dockerfile
      args: { APP_PATH: apps/replay-service }
    image: ${IMAGE_PREFIX:-ghcr.io/pjclavero/s9-ai-arena}/replay-service:${TAG:-latest}
    profiles: [nucleo, development, production, external-db]
    networks: [platform, data]
    environment:
      <<: *node-db-env
      PORT: "8083"
      SERVICE_ENTRY: ${REPLAY_SERVICE_ENTRY:-apps/replay-service/src/main.ts}
      REPLAYS_DIR: /data/replays
      # B7 · el entrypoint de la imagen ajusta la propiedad de este directorio
      # (y SOLO de este) antes de bajar a `node`. Es lo que impide que se
      # repita el EACCES silencioso de VM108 cuando el volumen se recree.
      ARENA_DATA_DIRS: /data/replays
      # B8 · secreto que autentica la ESCRITURA (POST /replays/:battleId y
      # POST /retention/sweep). Las rutas de LECTURA que consume el visor por el
      # gateway siguen abiertas a propósito. Sin este fichero, el servicio
      # arranca y sirve lecturas, pero rechaza toda escritura con 401.
      REPLAY_INGEST_SECRET_FILE: /run/secrets/replay_ingest_secret
    secrets: [postgres_password, replay_ingest_secret]
    volumes:
      - arena_replays:/data/replays
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8083/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  # ── queue · Redis para trabajos ──────────────────────────────────────────────
  queue:
    image: redis:7-alpine
    profiles: [nucleo, development, production, external-db]
    networks: [platform]
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - queue_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  # ── postgres · BD (omitido en el perfil external-db, nota del 6.2) ──────────
  postgres:
    image: postgres:16-alpine
    profiles: [nucleo, development, production]
    networks: [data]
    environment:
      POSTGRES_USER: arena
      POSTGRES_DB: arena
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena -d arena"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  # ── streamer · Chromium + FFmpeg, opcional (E11) ─────────────────────────────
  # En `public` SOLO para tener salida RTMPS (las redes internas no tienen
  # Internet); no publica ningún puerto.
  streamer:
    build:
      context: ..
      dockerfile: infrastructure/docker/streamer/Dockerfile
    image: ${IMAGE_PREFIX:-ghcr.io/pjclavero/s9-ai-arena}/streamer:${TAG:-latest}
    profiles: [streaming]
    networks: [platform, public]
    environment:
      BROADCAST_URL: ${BROADCAST_URL:-http://web:3000/broadcast}
      RTMPS_URL: ${RTMPS_URL:-rtmps://a.rtmps.youtube.com/live2}
      STREAM_KEY_FILE: /run/secrets/stream_key
      # E11/T11.2: rtmps (emitir) | record (solo grabación a arena_replays/video, E11.M)
      STREAM_MODE: ${STREAM_MODE:-rtmps}
      # x264 por software (base); nvenc exige GPU con passthrough en Proxmox (runbook)
      STREAM_ENCODER: ${STREAM_ENCODER:-x264}
      STREAM_AUTOSTART: ${STREAM_AUTOSTART:-0}
      STREAMER_CONTROL_PORT: "8090"
      RECORD_DIR: /data/replays/video
      # B13 · Mismo mecanismo que B7 en replay-service/tournament-worker: el
      # entrypoint de la imagen (compartido con node-service) asegura la
      # propiedad del volumen antes de bajar a `streamer`, y el servicio hace
      # preflight de escritura en modo record. Sin esto, una recreación del
      # volumen dejaba al streamer grabando contra un directorio ajeno: ffmpeg
      # moría en bucle y /healthz seguía diciendo "ok" (el patrón que dejó
      # arena_replays vacío diez días).
      #
      # Es /data/replays y NO /data/replays/video (que es donde escribe) a
      # propósito: la INVARIANTE de la cabecera de entrypoint.sh prohíbe rutas de
      # más de un componente dentro de un volumen compartido —el componente
      # intermedio sería escribible por otro contenedor durante la ventana entre
      # validación y chown—, y el propio entrypoint ahora las RECHAZA. El
      # subdirectorio `video/` lo crea el servicio, ya sin privilegios, en su
      # preflight. Que esto funcione depende de que `streamer` sea uid:gid
      # 1000:1000 igual que `node`: lo comprueba el build de la imagen con `stat`.
      ARENA_DATA_DIRS: /data/replays
      LOG_FORMAT: json
    volumes:
      # Solo para el modo grabación E11.M (clips a arena_replays/video).
      - arena_replays:/data/replays
    secrets: [stream_key]
    healthcheck:
      # La API interna de control responde aunque la emisión esté parada; el
      # estado de la emisión en sí lo vigila E10 por /metrics (streamer_up).
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/healthz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: "4.0", memory: 4G }
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  # ── bot-runtime-template · plantilla de contenedor efímero de bot (E6) ──────
  # bot-manager clona esta configuración para cada bot real: SOLO red arena
  # (sin ruta a postgres, redis ni api), sin capacidades, sistema de archivos
  # de solo lectura y límites estrictos. El perfil `bots` permite probar la
  # plantilla en desarrollo.
  bot-runtime-template:
    build:
      context: ..
      dockerfile: infrastructure/docker/bot-runtime/Dockerfile
    image: ${IMAGE_PREFIX:-ghcr.io/pjclavero/s9-ai-arena}/bot-runtime-python:${TAG:-latest}
    profiles: [bots]
    networks: [arena]
    environment:
      ARENA_WS_URL: ws://arena-engine:8081
      LOG_FORMAT: json
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    healthcheck:
      # Contrato con E6: el runtime toca /tmp/alive al conectar con el motor.
      test: ["CMD-SHELL", "test -f /tmp/alive"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M, pids: 64 }
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    logging: *default-logging

  # ── backup · pg_dump + restic con cron dentro del stack (T10.4) ─────────────
  # En public SOLO para alcanzar el destino restic (NAS/ZFS del operador):
  # las redes internas no tienen salida. No publica puertos. Los volúmenes de
  # datos se montan de SOLO lectura; secrets/ se copia cifrado por restic.
  backup:
    build:
      context: ..
      dockerfile: infrastructure/docker/backup/Dockerfile
    image: ${IMAGE_PREFIX:-ghcr.io/pjclavero/s9-ai-arena}/backup:${TAG:-latest}
    profiles: [production, external-db]
    networks: [data, public]
    environment:
      BACKUP_CRON: ${BACKUP_CRON:-15 4 * * *}
      REPLAY_RETENTION_DAYS: ${REPLAY_RETENTION_DAYS:-180}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      # fix/backup-sftp-scheduled-runtime: el backend `sftp:` de restic
      # necesita una clave SSH y un known_hosts propios DENTRO del
      # contenedor programado (no comparte ~/.ssh del host, que es donde se
      # hizo a mano el primer backup real). Sólo se usan si RESTIC_REPOSITORY
      # empieza por "sftp:" (ver setup_ssh en backup.sh); en un repositorio
      # local no hacen nada. NUNCA StrictHostKeyChecking=no: el known_hosts
      # es la única verificación de huella del destino del backup.
      RESTIC_SSH_KEY_FILE: /run/secrets/restic_ssh_key
      RESTIC_SSH_KNOWN_HOSTS_FILE: /run/secrets/restic_ssh_known_hosts
      PGHOST: postgres
      PGUSER: arena
      PGDATABASE: arena
      PGPASSWORD_FILE: /run/secrets/postgres_password
      METRICS_DIR: /textfile
      WORK_DIR: /tmp/backup-work
    secrets: [postgres_password, restic_password, restic_ssh_key, restic_ssh_known_hosts]
    volumes:
      - arena_maps:/data/maps:ro
      - arena_bot_sources:/data/bot-sources:ro
      - arena_replays:/data/replays:ro
      - arena_assets:/data/assets:ro
      - ./secrets:/secrets:ro
      - backup_metrics:/textfile
      # #110b: backup.sh construye un "staging" en $WORK_DIR con una copia de
      # maps/bot_sources/assets/replays (para que el manifest y los datos
      # queden en el mismo árbol al restaurar). Sin este volumen, ese
      # crecimiento caía en la capa de escritura del contenedor, compartida
      # con el resto de /tmp y sin límite ni visibilidad propia. Con el
      # volumen aparte, `docker system df -v` lo muestra por separado y se
      # puede vigilar/purgar sin tocar el resto del contenedor.
      - backup_work:/tmp/backup-work
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "pgrep crond >/dev/null"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  # ═══════════════════════════════════════════════════════════════════════════
  # Perfil observability (T10.3, cap. 24, ADR-010 D10.3) — OPCIONAL:
  # la plataforma funciona sin él (test en infrastructure/tests/).
  # ═══════════════════════════════════════════════════════════════════════════

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: [observability]
    networks: [platform]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  # En public SOLO para poder entregar la notificación (webhook/email) del
  # operador: las redes internas no tienen salida. No publica puertos.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: [observability]
    networks: [platform, public]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        sed "s|__ALERT_WEBHOOK_URL__|$${ALERT_WEBHOOK_URL:-http://localhost/webhook-sin-configurar}|"
        /etc/alertmanager/alertmanager.yml.tpl > /tmp/alertmanager.yml &&
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml
        --storage.path=/alertmanager
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - ./observability/alertmanager/alertmanager.yml.tpl:/etc/alertmanager/alertmanager.yml.tpl:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.1.0
    profiles: [observability]
    networks: [platform]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets: [grafana_admin_password]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  loki:
    image: grafana/loki:3.1.0
    profiles: [observability]
    networks: [platform]
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  # Lee los json-file de Docker SOLO con un bind de solo lectura (sin
  # docker.sock: el escáner del cap. 28 no lo permite en ningún servicio, R1.7).
  promtail:
    image: grafana/promtail:3.1.0
    profiles: [observability]
    networks: [platform]
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail_positions:/positions
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9080/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  # CPU/RAM por contenedor. Sin docker.sock: usa cgroups (/rootfs, /sys,
  # /var/lib/docker de solo lectura).
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    profiles: [observability]
    networks: [platform]
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  # Disco/CPU/RAM del host + textfile collector para las métricas del backup
  # (s9_backup_*, T10.4: volumen backup_metrics compartido con el servicio backup).
  node-exporter:
    image: prom/node-exporter:v1.8.1
    profiles: [observability]
    networks: [platform]
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
    pid: host
    volumes:
      - /:/host:ro,rslave
      - backup_metrics:/textfile:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9100/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  # Métricas de PostgreSQL (pg_up para la alerta de BD caída). Con BD externa
  # (perfil external-db) el operador ajusta DATA_SOURCE_URI en .env.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    profiles: [observability]
    networks: [platform, data]
    environment:
      DATA_SOURCE_URI: ${PG_EXPORTER_URI:-postgres:5432/arena?sslmode=disable}
      DATA_SOURCE_USER: arena
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9187/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

networks:
  # Solo el gateway tiene acceso exterior (6.4).
  public:
    driver: bridge
  platform:
    driver: bridge
    internal: true
  arena:
    # Nombre FIJO `arena` (sin prefijo de proyecto): compliance.mjs y el docker-proxy
    # exigen literalmente "arena" como red de los runners de bots. Sin este `name`,
    # Compose la prefijaría (p. ej. infrastructure_arena) y el proxy la rechazaría.
    name: arena
    driver: bridge
    internal: true
  build:
    driver: bridge
    internal: true
  data:
    driver: bridge
    internal: true

volumes:
  # Los seis volúmenes persistentes del 6.3.
  arena_maps:
  arena_replays:
  arena_bot_sources:
  arena_build_cache:
  arena_assets:
  # B13 · arena_logs se declara porque forma parte de los seis volúmenes del
  # 6.3, pero HOY no lo monta ningún servicio: el único que lo montaba era
  # arena-engine, que nunca abre /data/logs (los logs van por stdout, contrato
  # del cap. 24). Se deja declarado —vacío y sin montar— en vez de montado en un
  # servicio que no lo usa.
  arena_logs:
  # Operativos (no forman parte de los seis del 6.3).
  postgres_data:
  queue_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:
  backup_metrics:
  # #110b: staging temporal de backup.sh (mitigación del riesgo de espacio
  # documentado en infrastructure/backup/backup.sh; separa ese crecimiento
  # de la capa de escritura del contenedor).
  backup_work:

secrets:
  # Secretos por archivo (nunca variables en claro). Se generan con
  # infrastructure/scripts/init-secrets.sh; el directorio secrets/ está en
  # .gitignore y NUNCA se versiona.
  postgres_password:
    file: ./secrets/postgres_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  # R-DEPLOY · R2: clave ed25519 (PEM PKCS8) con la que el bot-build-worker firma
  # los artefactos de bots (ERR-SEC-15). La genera init-secrets.sh; sin ella el
  # worker no arranca (fallo cerrado).
  artifact_signing_key:
    file: ./secrets/artifact_signing_key.pem
  stream_key:
    file: ./secrets/stream_key.txt
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
  restic_password:
    file: ./secrets/restic_password.txt
  # fix/backup-sftp-scheduled-runtime: clave privada SSH (OpenSSH, ed25519)
  # dedicada al backup, y su known_hosts correspondiente — SÓLO necesarios si
  # RESTIC_REPOSITORY usa el backend sftp:. La clave la genera
  # init-secrets.sh; el known_hosts NO se autogenera (requiere que el
  # operador verifique la huella del host de respaldo fuera de banda, p. ej.
  # comparándola con la que muestra el propio servidor) y se deja vacío para
  # que el operador lo complete — ver infrastructure/.env.example.
  restic_ssh_key:
    file: ./secrets/restic_ssh_key
  restic_ssh_known_hosts:
    file: ./secrets/restic_ssh_known_hosts
  # B2 · secreto interno compartido api<->arena-engine para autenticar POST /run
  # (cabecera x-arena-engine-auth). El MISMO fichero se monta en ambos
  # servicios: solo así coinciden sin ponerlo en claro en el entorno.
  arena_engine_internal_secret:
    file: ./secrets/arena_engine_internal_secret.txt
  # B8 · secreto interno compartido api<->replay-service para autenticar la
  # ingesta de replays (cabecera x-replay-ingest-auth) y el barrido de
  # retención. Mismo criterio que arena_engine_internal_secret: el MISMO fichero
  # montado en ambos servicios. Lo genera init-secrets.sh.
  replay_ingest_secret:
    file: ./secrets/replay_ingest_secret.txt
