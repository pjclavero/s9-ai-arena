# nginx del panel web: estáticos + fallback de SPA. El enrutado de /api/v1 lo
# hace el gateway (cap. 6.2), no este servidor. PRC (TD-004): el navegador lee
# los replays por /api/v1/replays/... (autorizado por la API); el gateway
# responde 404 en /replays* y este servidor nunca habla con el replay-service.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Señal de infraestructura para el healthcheck del Compose.
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"web"}';
    }

    # ADR-016 · identidad de build de ESTA imagen, generada en el build.
    location = /version {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-store";
        alias /usr/share/nginx/html/version.json;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta desconocida la resuelve el router de React.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
