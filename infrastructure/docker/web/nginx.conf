# nginx del panel web: estáticos + fallback de SPA. El navegador PÚBLICO entra
# siempre por el gateway (cap. 6.2), que enruta /api/v1 y /ws antes de llegar
# aquí. PRC (TD-004): el navegador lee los replays por /api/v1/replays/...
# (autorizado por la API); el gateway responde 404 en /replays* y este servidor
# nunca habla con el replay-service.
#
# BROADCAST-PUBLIC-ACCESS (2026-11-12) · Hay UN cliente que NO entra por el
# gateway: el Chromium del streamer, que carga BROADCAST_URL=http://web:3000/broadcast
# por la red interna `platform`. Sin las dos `location` de abajo, su
# `GET /api/v1/battles/{id}` caía en el fallback de SPA (200 text/html con el
# index.html), `res.json()` fallaba, el director tragaba el error y /broadcast se
# quedaba en «La batalla empieza en breve» con la batalla EN CURSO y el directo
# público activado. Por eso este servidor reenvía /api/v1/ y /ws/ a los MISMOS
# upstreams y con las MISMAS reescrituras que el gateway en el modo real
# (nginx-behind-proxy.conf): no abre nada que el gateway no exponga ya, la
# autorización sigue siendo la de la API (anónimo = visitante) y /replays* NO se
# reenvía (sigue en el fallback de SPA, nunca llega al replay-service).
# La paridad con el gateway la fija infrastructure/tests/web-nginx-proxy.test.ts.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker en caliente: con upstreams en variable, nginx arranca
    # aunque api o tournament-worker aún no existan (mismo patrón que el gateway).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API para el Chromium del streamer (ver cabecera). Idéntico al gateway.
    location /api/v1/ {
        set $api_up http://api:8080;
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass $api_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Canal de espectador (wsUrl relativo «/ws/spectate/<id>»). Idéntico al gateway.
    location /ws/ {
        set $engine_up http://tournament-worker:8081;
        rewrite ^/ws/(.*)$ /$1 break;
        proxy_pass $engine_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Señal de infraestructura para el healthcheck del Compose.
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"web"}';
    }

    # ADR-016 · identidad de build de ESTA imagen, generada en el build.
    location = /version {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-store";
        alias /usr/share/nginx/html/version.json;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta desconocida la resuelve el router de React.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
