# Presupuesto de recursos del stack (D-OP-32: recursos fijos, sin ampliar hardware).
#
# Fuente de verdad VERSIONADA de los límites de cada servicio y del escenario de
# pico simultáneo. La comprueba infrastructure/tests/resource-budget.test.ts contra
# infrastructure/docker-compose.yml: si cambias un límite del compose, cambia aquí
# también (y justifica el valor en docs/operations/resource-budget.md).
#
# TRES NIVELES de cifra, siempre separados (no se mezclan):
#   1. MEDIDO   (`ram_idle_mib`, `ram_peak_measured_mib`, `measured`): lo observado en el
#               stack real, con fuente y fecha. Nunca se rellena con una estimación.
#   2. ESCENARIO (`ram_scenario_mib`): pico medido × `safety.service_peak_factor` (margen
#               de seguridad explícito). Es lo que se suma para decidir si el escenario
#               cabe y debe dejar `safety.min_available_mib` libres. Si el servicio NO está
#               medido en esa situación (`basis: estimated`), es una estimación declarada.
#   3. TEÓRICO  (`limit`): el techo de cgroup (`mem_limit`/`cpus`). Es el peor caso
#               documentado, que la VM no puede sostener si todos lo alcanzan a la vez:
#               lo mitiga el límite por contenedor (OOM aislado en el contenedor), el
#               `MemorySwap = Memory` del bot y, en el streamer, `oom_score_adj`.
#
# Unidades: CPU en núcleos, memoria en MiB.

version: 1

# Límites físicos NO ampliables (D-OP-32).
host:
  vcpus: 6
  # 6,84 GB (decimal) = 6523 MiB. Se usa la cifra más estricta; el kernel de la VM
  # declara ~6778 MiB visibles.
  ram_mib: 6523

# Reserva para el sistema operativo, el demonio de Docker y la caché de páginas.
# Medido: el uso del host fuera de los contenedores ronda 0,5 GiB.
reserve:
  cpus: 0.5
  ram_mib: 768

# Margen de seguridad explícito.
safety:
  # Factor aplicado al pico MEDIDO de cada servicio para obtener su cifra de escenario.
  service_peak_factor: 1.25
  # RAM que debe seguir DISPONIBLE (tras sumar todo el escenario y la reserva). El operador
  # no acepta márgenes de unos cientos de MiB para dar por estable una 4v4 con emisión.
  min_available_mib: 1024
  # Peor caso teórico parcial (bots y streamer en su techo de cgroup, el resto en su
  # cifra de escenario): no debe superar el límite duro de la VM.
  # Esta comprobación SÓLO vale porque cada contenedor tiene límite propio.

# Contenedor de bot: el techo lo fija el código del bot-manager (DEFAULT_LIMITS en
# apps/bot-manager/src/container-runner.ts); el test lo cruza con ese valor.
bot:
  cpus: 0.5
  mem_mib: 256
  # MEDIDO en una 4v4 TDM de producción (2026-11-23, sin emisión): 19-36 MiB de pico por
  # bot y ≤ 1,4 % de un núcleo. Antes, sobre 70 batallas (2026-11-22): CPU mediana 0,010,
  # máx. 0,021.
  measured: { ram_peak_mib: 36, cpu_max: 0.021, source: "medición en producción 2026-11-23 (4v4 TDM, 1v1 DM) y participants.cpu_ms de 70 batallas" }
  # Cifras de ESCENARIO (medido × margen): 64 MiB (1,8× el pico) y 0,03 CPU.
  ram_scenario_mib: 64
  cpu_planning: 0.03

# Motor de batalla (corre dentro del tournament-worker).
battle:
  # MEDIDO (4v4 TDM, 2026-11-23): el pico del worker pasa de 130 MiB en reposo a 252 MiB
  # (+122). Por batalla simultánea EXTRA se planifica +160 MiB (122 × 1,25 redondeado).
  worker_extra_ram_mib: 160
  # MEDIDO: CPU media del worker en una 4v4 8,6 % de un núcleo (0,086); se planifica 0,11.
  cpu_planning: 0.11
  # MEDIDO: pico transitorio del worker al arrancar o cerrar una batalla, 155 % de un
  # núcleo (5 periodos estrangulados de 1891, 237 ms). Sólo una batalla a la vez en ese
  # estado y sin coincidir con un build de bot.
  cpu_transient_peak: 1.55

# Escenario de pico simultáneo que DEBE caber: emisión 1080p30 + batallas + 1 build de bot
# (sandbox a su TECHO, no medido) + el resto de servicios.
scenario:
  name: streaming-1080p30-mas-batallas
  build_sandboxes: 1
  streaming: true

# Concurrencia máxima segura del worker por tipo de batalla (batallas simultáneas).
# El test exige declarada ≤ máximo que cabe en el modelo (RAM con margen mínimo, CPU media y
# CPU con el pico transitorio). Hoy sólo se ha MEDIDO una batalla a la vez, así que
# `validated_simultaneous` es 1: cualquier valor > 1 es teórico hasta medirlo en el
# laboratorio (y la 4v4 CTF, con su incidente de heap, se mantiene en 1).
concurrency:
  validated_simultaneous: 1
  while_streaming: { 1v1: 2, 2v2: 2, 3v3: 1, 4v4: 1 }
  without_streaming: { 1v1: 3, 2v2: 2, 3v3: 1, 4v4: 1 }
  bots: { 1v1: 2, 2v2: 4, 3v3: 6, 4v4: 8 }

# Sobreasignación TEÓRICA tolerada (suma de techos / capacidad). Cable trampa: sube si alguien
# añade límites sin pensar en el conjunto. Antes de este presupuesto: RAM 2,63×, CPU 4,7×.
overcommit:
  max_ram_ratio: 1.35
  max_cpu_ratio: 3.5
  # Si TODOS los techos de memoria (servicios + bots + sandbox) se alcanzaran a la vez, la VM
  # no los sostendría. Es un riesgo documentado, no un caso garantizado: lo contiene el límite
  # por contenedor. El test comprueba que esta marca es verdadera (no se oculta).
  all_limits_exceed_vm: true

# Servicios. `limit` = lo que declara el compose (TEÓRICO).
# MEDIDO: ram_idle_mib / ram_peak_measured_mib (producción, 2026-11-23, 4v4 TDM sin emisión;
# fuente: informe de medición del carril de streaming) salvo los marcados `basis: estimated`.
# ESCENARIO: ram_scenario_mib (≥ pico medido × factor si basis=measured).
services:
  gateway:
    limit: { cpus: 0.5, mem_mib: 128 }
    running: true
    ram_idle_mib: 6
    ram_peak_measured_mib: 18
    ram_scenario_mib: 24
    cpu_expected: 0.05
    basis: measured
  web:
    limit: { cpus: 0.5, mem_mib: 256 }
    running: true
    ram_idle_mib: 8
    ram_peak_measured_mib: 25
    ram_scenario_mib: 32
    cpu_expected: 0.02
    basis: measured
  api:
    limit: { cpus: 2.0, mem_mib: 768 }
    running: true
    ram_idle_mib: 125
    ram_peak_measured_mib: 207
    ram_scenario_mib: 260
