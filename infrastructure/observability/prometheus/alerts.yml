# Reglas de alerta del cap. 24: motor bloqueado, cola acumulada, disco,
# BD caída, stream caído y (T10.4) backup fallido o caducado.
groups:
  - name: s9-arena
    rules:
      # Motor bloqueado: el bucle de tick no avanza. Con scrape de 5 s y
      # for: 10s, dispara en < 30 s desde la pausa (DoD; verificación real
      # pendiente de entorno con Docker: test de caos de docs/entrega-E10.md).
      - alert: EngineTickStalled
        expr: time() - arena_engine_last_tick_timestamp_seconds > 10
        for: 10s
        labels: { severity: critical }
        annotations:
          summary: "Motor bloqueado: el tick lleva {{ $value | humanize }}s sin avanzar"

      - alert: EngineDown
        expr: up{job="arena-engine"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "arena-engine no responde al scrape"

      # Cola acumulada.
      - alert: QueueBacklog
        expr: max by (queue) (arena_queue_depth) > 100
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Cola {{ $labels.queue }} acumulada: {{ $value }} trabajos > 10 min"

      # Disco.
      - alert: DiskAlmostFull
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes < 0.10
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: "Disco {{ $labels.mountpoint }} con menos del 10% libre"

      # BD caída.
      - alert: PostgresDown
        expr: pg_up == 0 or up{job="postgres"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "PostgreSQL caído (pg_up=0 o exporter inaccesible)"

      # Stream caído (solo aplica con el perfil streaming activo): el contenedor
      # del streamer dejó de verse en cAdvisor.
      - alert: StreamDown
        expr: time() - max(container_last_seen{container_label_com_docker_compose_service="streamer"}) > 120
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "El streamer lleva más de 2 min sin latir (cAdvisor)"

      # Errores por endpoint (contrato http_requests_total).
      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(http_requests_total{status=~"5.."}[5m]))
            / sum by (service) (rate(http_requests_total[5m])) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }}: más del 5% de respuestas 5xx"

  - name: s9-backup
    rules:
      # T10.4: el backup escribe s9_backup_* vía textfile collector de
      # node-exporter (volumen backup_metrics).
      # #110b: exit 1 = FULL FAILURE (fuente crítica o restic rotos, sin
      # snapshot fiable). exit 2 = PARTIAL SUCCESS (ver BackupPartialSuccess
      # más abajo): se excluye aquí a propósito para no tratar como crítico
      # un backup que sí guardó postgres+secretos.
      - alert: BackupFailed
        expr: s9_backup_last_exit_code == 1
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "El último backup terminó en FULL FAILURE (exit {{ $value }})"

      - alert: BackupTooOld
        expr: time() - s9_backup_last_success_timestamp_seconds > 26 * 3600
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: "Sin backup completado en las últimas 26 h (DoD T10.4)"

      # #110b: exit 2 (PARTIAL SUCCESS) NO dispara BackupFailed —su expr es
      # "== 1", no "!= 0"— a propósito, para no tratar como crítico un
      # backup que SÍ guardó lo importante (postgres + secretos) pero con
      # una fuente secundaria (maps/bot_sources/replays/assets) en error.
      # Alerta de menor severidad para revisar esa fuente.
      - alert: BackupPartialSuccess
        expr: s9_backup_last_exit_code == 2
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "El último backup fue parcial (exit 2): revisar s9_backup_source_error por fuente"

      - alert: BackupMetricsMissing
        expr: absent(s9_backup_last_success_timestamp_seconds)
        for: 2h
        labels: { severity: warning }
        annotations:
          summary: "No hay métricas de backup: ¿servicio backup parado?"

  # EQ5b · Alertas del streamer. TODAS van condicionadas a que haya una emisión
  # PEDIDA (`streamer_desired == 1`, la expone el propio streamer) o, en
  # StreamerDown, a que la API diga que el streaming está ACTIVADO y con una
  # sesión activa (gauges s9_streaming_* de la API; exigen S9_METRICS_ENABLED).
  # Con el streaming desactivado o la emisión parada, ninguna puede saltar.
  # Probadas con promtool: infrastructure/observability/prometheus/alerts-streamer.test.yml.
  - name: s9-streamer
    rules:
      # La API tiene una sesión activa y el streamer no emite (o ni responde).
      - alert: StreamerDown
        expr: |
          (max(s9_streaming_session_active) == 1 and on() max(s9_streaming_enabled) == 1)
            unless on() (max(streamer_up) == 1)
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Hay una emisión activa en Administración → Streaming y el streamer no está emitiendo"

      # Cortes encadenados: más de 5 reintentos en 10 min con la emisión pedida.
      - alert: StreamerRestartLoop
        expr: increase(streamer_restarts_total[10m]) > 5 and on() max(streamer_desired) == 1
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "El streamer se reinicia en bucle ({{ $value | humanize }} reintentos en 10 min)"

      # Más del 5 % de frames descartados durante 5 min (CPU insuficiente o ingesta lenta).
      - alert: StreamerDroppedFramesHigh
        expr: |
          (rate(streamer_dropped_frames_total[5m]) / clamp_min(rate(streamer_frames_total[5m]), 1)) > 0.05
            and on() max(streamer_desired) == 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "El streamer descarta más del 5% de los frames"

      # La emisión está pedida pero ffmpeg no informa progreso desde hace más de 60 s.
      - alert: StreamerNoProgress
        expr: max(streamer_progress_age_seconds) > 60 and on() max(streamer_desired) == 1
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "La emisión no avanza: {{ $value | humanize }} s sin progreso de ffmpeg"
